 sequence numbers. For example, there is an effective attack against SSH's use of ChaCha20-Poly1305 (and CBC with Encrypt-then-MAC). The bypass occurs in chacha20-poly1305@openssh.com and (if CBC is used) the -etm@openssh.com MAC algorithms. This also affects Maverick Synergy Java SSH API before 3.1.0-SNAPSHOT, Dropbear through 2022.83, Ssh before 5.1.1 in Erlang/OTP, PuTTY before 0.80, AsyncSSH before 2.14.2, golang.org/x/crypto before 0.17.0, libssh before 0.10.6, libssh2 through 1.11.0, Thorn Tech SFTP Gateway before 3.4.6, Tera Term before 5.1, Paramiko before 3.4.0, jsch before 0.2.15, SFTPGo before 2.5.6, Netgate pfSense Plus through 23.09.1, Netgate pfSense CE through 2.7.2, HPN-SSH through 18.2.0, ProFTPD before 1.3.8b (and before 1.3.9rc2), ORYX CycloneSSH before 2.3.4, NetSarang XShell 7 before Build 0144, CrushFTP before 10.6.0, ConnectBot SSH library before 2.2.22, Apache MINA sshd through 2.11.0, sshj through 0.37.0, TinySSH through 20230101, trilead-ssh2 6401, LANCOM LCOS and LANconfig, FileZilla before 3.66.4, Nova before 11.8, PKIX-SSH before 14.4, SecureCRT before 9.4.3, Transmit5 before 5.10.4, Win32-OpenSSH before 9.5.0.0p1-Beta, WinSCP before 6.2.2, Bitvise SSH Server before 9.32, Bitvise SSH Client before 9.33, KiTTY through 0.76.1.13, the net-ssh gem 7.2.0 for Ruby, the mscdex ssh2 module before 1.15.0 for Node.js, the thrussh library before 0.35.1 for Rust, and the Russh crate before 0.40.2 for Rust.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47914", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.45.0", "title": "golang.org/x/crypto/ssh/agent: in golang.org/x/crypto/ssh/agent", "description": "SSH Agent servers do not validate the size of messages when processing new identity requests, which may cause the program to panic if the message is malformed due to an out of bounds read.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58181", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.45.0", "title": "golang.org/x/crypto/ssh: in golang.org/x/crypto/ssh", "description": "SSH servers parsing GSSAPI authentication requests do not validate the number of mechanisms specified in the request, allowing an attacker to cause unbounded memory consumption.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45288", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.23.0", "title": "golang: net/http, x/net/http2: unlimited number of CONTINUATION frames causes DoS", "description": "An attacker may cause an HTTP/2 endpoint to read arbitrary amounts of header data by sending an excessive number of CONTINUATION frames. Maintaining HPACK state requires parsing and processing all HEADERS and CONTINUATION frames on a connection. When a request's headers exceed MaxHeaderBytes, no memory is allocated to store the excess headers, but they are still parsed. This permits an attacker to cause an HTTP/2 endpoint to read arbitrary amounts of header data, all associated with a request which is going to be rejected. These headers can include Huffman-encoded data which is significantly more expensive for the receiver to decode than for an attacker to send. The fix sets a limit on the amount of excess header frames we will process before closing a connection.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22870", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.36.0", "title": "golang.org/x/net/proxy: golang.org/x/net/http/httpproxy: HTTP Proxy bypass using IPv6 Zone IDs in golang.org/x/net", "description": "Matching of hosts against proxy patterns can improperly treat an IPv6 zone ID as a hostname component. For example, when the NO_PROXY environment variable is set to \"*.example.com\", a request to \"[::1%25.example.com]:80` will incorrectly match and not be proxied.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22872", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.38.0", "title": "golang.org/x/net/html: Incorrect Neutralization of Input During Web Page Generation in x/net in golang.org/x/net", "description": "The tokenizer incorrectly interprets tags with unquoted attribute values that end with a solidus character (/) as self-closing. When directly using Tokenizer, this can result in such tags incorrectly being marked as self-closing, and when using the Parse functions, this can result in content following such tags as being placed in the wrong scope during DOM construction, but only when tags are in foreign content (e.g. <math>, <svg>, etc contexts).", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22868", "severity": "HIGH", "package_name": "golang.org/x/oauth2", "installed_version": "v0.13.0", "fixed_version": "0.27.0", "title": "golang.org/x/oauth2/jws: Unexpected memory consumption during token parsing in golang.org/x/oauth2/jws", "description": "An attacker can pass a malicious malformed token which causes unexpected memory to be consumed during parsing.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24786", "severity": "MEDIUM", "package_name": "google.golang.org/protobuf", "installed_version": "v1.31.0", "fixed_version": "1.33.0", "title": "golang-protobuf: encoding/protojson, internal/encoding/json: infinite loop in protojson.Unmarshal when unmarshaling certain forms of invalid JSON", "description": "The protojson.Unmarshal function can enter an infinite loop when unmarshaling certain forms of invalid JSON. This condition can occur when unmarshaling into a message which contains a google.protobuf.Any value, or when the UnmarshalOptions.DiscardUnknown option is set.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24790", "severity": "CRITICAL", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.11, 1.22.4", "title": "golang: net/netip: Unexpected behavior from Is methods for IPv4-mapped IPv6 addresses", "description": "The various Is methods (IsPrivate, IsLoopback, etc) did not work as expected for IPv4-mapped IPv6 addresses, returning false for addresses which would return true in their traditional IPv4 forms.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45288", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.9, 1.22.2", "title": "golang: net/http, x/net/http2: unlimited number of CONTINUATION frames causes DoS", "description": "An attacker may cause an HTTP/2 endpoint to read arbitrary amounts of header data by sending an excessive number of CONTINUATION frames. Maintaining HPACK state requires parsing and processing all HEADERS and CONTINUATION frames on a connection. When a request's headers exceed MaxHeaderBytes, no memory is allocated to store the excess headers, but they are still parsed. This permits an attacker to cause an HTTP/2 endpoint to read arbitrary amounts of header data, all associated with a request which is going to be rejected. These headers can include Huffman-encoded data which is significantly more expensive for the receiver to decode than for an attacker to send. The fix sets a limit on the amount of excess header frames we will process before closing a connection.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34156", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "encoding/gob: golang: Calling Decoder.Decode on a message which contains deeply nested structures can cause a panic due to stack exhaustion", "description": "Calling Decoder.Decode on a message which contains deeply nested structures can cause a panic due to stack exhaustion. This is a follow-up to CVE-2022-30635.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47907", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.12, 1.24.6", "title": "database/sql: Postgres Scan Race Condition", "description": "Cancelling a query (e.g. by cancelling the context passed to one of the query methods) during a call to the Scan method of the returned Rows can result in unexpected results if other queries are being made in parallel. This can result in a race condition that may overwrite the expected results with those of another query, causing the call to Scan to return either unexpected results from the other query or an error.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58183", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "golang: archive/tar: Unbounded allocation when parsing GNU sparse map", "description": "tar.Reader does not set a maximum size on the number of sparse region data blocks in GNU tar pax 1.0 sparse files. A maliciously-crafted archive containing a large number of sparse regions can cause a Reader to read an unbounded amount of data from the archive into memory. When reading from a compressed source, a small compressed input can result in large allocations.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61729", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.11, 1.25.5", "title": "crypto/x509: Excessive resource consumption when printing error string for host certificate validation in crypto/x509", "description": "Within HostnameError.Error(), when constructing an error string, there is no limit to the number of hosts that will be printed out. Furthermore, the error string is constructed by repeated string concatenation, leading to quadratic runtime. Therefore, a certificate provided by a malicious actor can result in excessive resource consumption.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-39326", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.20.12, 1.21.5", "title": "golang: net/http/internal: Denial of Service (DoS) via Resource Consumption via HTTP requests", "description": "A malicious HTTP sender can use chunk extensions to cause a receiver reading from a request or response body to read many more bytes from the network than are in the body. A malicious HTTP client can further exploit this to cause a server to automatically read a large amount of data (up to about 1GiB) when a handler fails to read the entire body of a request. Chunk extensions are a little-used HTTP feature which permit including additional metadata in a request or response body sent using the chunked encoding. The net/http chunked encoding reader discards this metadata. A sender can exploit this by inserting a large metadata segment with each byte transferred. The chunk reader now produces an error if the ratio of real body to encoded bytes grows too small.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45289", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/http/cookiejar: incorrect forwarding of sensitive headers and cookies on HTTP redirect", "description": "When following an HTTP redirect to a domain which is not a subdomain match or exact match of the initial domain, an http.Client does not forward sensitive headers such as \"Authorization\" or \"Cookie\". For example, a redirect from foo.com to www.foo.com will forward the Authorization header, but a redirect to bar.com will not. A maliciously crafted HTTP redirect could cause sensitive headers to be unexpectedly forwarded.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45290", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/http: golang: mime/multipart: golang: net/textproto: memory exhaustion in Request.ParseMultipartForm", "description": "When parsing a multipart form (either explicitly with Request.ParseMultipartForm or implicitly with Request.FormValue, Request.PostFormValue, or Request.FormFile), limits on the total size of the parsed form were not applied to the memory consumed while reading a single form line. This permits a maliciously crafted input containing very long lines to cause allocation of arbitrarily large amounts of memory, potentially leading to memory exhaustion. With fix, the ParseMultipartForm function now correctly limits the maximum size of form lines.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24783", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: crypto/x509: Verify panics on certificates with an unknown public key algorithm", "description": "Verifying a certificate chain which contains a certificate with an unknown public key algorithm will cause Certificate.Verify to panic. This affects all crypto/tls clients, and servers that set Config.ClientAuth to VerifyClientCertIfGiven or RequireAndVerifyClientCert. The default behavior is for TLS servers to not verify client certificates.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24784", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/mail: comments in display names are incorrectly handled", "description": "The ParseAddressList function incorrectly handles comments (text within parentheses) within display names. Since this is a misalignment with conforming address parsers, it can result in different trust decisions being made by programs using different parsers.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24785", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: html/template: errors returned from MarshalJSON methods may break template escaping", "description": "If errors returned from MarshalJSON methods contain user controlled data, they may be used to break the contextual auto-escaping behavior of the html/template package, allowing for subsequent actions to inject unexpected content into templates.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24789", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.11, 1.22.4", "title": "golang: archive/zip: Incorrect handling of certain ZIP files", "description": "The archive/zip package's handling of certain types of invalid zip files differs from the behavior of most zip implementations. This misalignment could be exploited to create an zip file with contents that vary depending on the implementation reading the file. The archive/zip package now rejects files containing these errors.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24791", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.12, 1.22.5", "title": "net/http: Denial of service due to improper 100-continue handling in net/http", "description": "The net/http HTTP/1.1 client mishandled the case where a server responds to a request with an \"Expect: 100-continue\" header with a non-informational (200 or higher) status. This mishandling could leave a client connection in an invalid state, where the next request sent on the connection will fail. An attacker sending a request to a net/http/httputil.ReverseProxy proxy can exploit this mishandling to cause a denial of service by sending \"Expect: 100-continue\" requests which elicit a non-informational response from the backend. Each such request leaves the proxy with an invalid connection, and causes one subsequent request using that connection to fail.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34155", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "go/parser: golang: Calling any of the Parse functions containing deeply nested literals can cause a panic/stack exhaustion", "description": "Calling any of the Parse functions on Go source code which contains deeply nested literals can cause a panic due to stack exhaustion.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34158", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "go/build/constraint: golang: Calling Parse on a \"// +build\" build tag line with deeply nested expressions can cause a panic due to stack exhaustion", "description": "Calling Parse on a \"// +build\" build tag line with deeply nested expressions can cause a panic due to stack exhaustion.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45336", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.11, 1.23.5, 1.24.0-rc.2", "title": "golang: net/http: net/http: sensitive headers incorrectly sent after cross-domain redirect", "description": "The HTTP client drops sensitive headers after following a cross-domain redirect. For example, a request to a.com/ containing an Authorization header which is redirected to b.com/ will not send that header to b.com. In the event that the client received a subsequent same-domain redirect, however, the sensitive headers would be restored. For example, a chain of redirects from a.com/, to b.com/1, and finally to b.com/2 would incorrectly send the Authorization header to b.com/2.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45341", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.11, 1.23.5, 1.24.0-rc.2", "title": "golang: crypto/x509: crypto/x509: usage of IPv6 zone IDs can bypass URI name constraints", "description": "A certificate with a URI which has a IPv6 address with a zone ID may incorrectly satisfy a URI name constraint that applies to the certificate chain. Certificates containing URIs are not permitted in the web PKI, so this only affects users of private PKIs which make use of URIs.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-0913", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.10, 1.24.4", "title": "Inconsistent handling of O_CREATE|O_EXCL on Unix and Windows in os in syscall", "description": "os.OpenFile(path, os.O_CREATE|O_EXCL) behaved differently on Unix and Windows systems when the target path was a dangling symlink. On Unix systems, OpenFile with O_CREATE and O_EXCL flags never follows symlinks. On Windows, when the target path was a symlink to a nonexistent location, OpenFile would create a file in that location. OpenFile now always returns an error when the O_CREATE and O_EXCL flags are both set and the target path is a symlink.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22866", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.12, 1.23.6, 1.24.0-rc.3", "title": "crypto/internal/nistec: golang: Timing sidechannel for P-256 on ppc64le in crypto/internal/nistec", "description": "Due to the usage of a variable time instruction in the assembly implementation of an internal function, a small number of bits of secret scalars are leaked on the ppc64le architecture. Due to the way this function is used, we do not believe this leakage is enough to allow recovery of the private key when P-256 is used in any well known protocols.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22871", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.8, 1.24.2", "title": "net/http: Request smuggling due to acceptance of invalid chunked data in net/http", "description": "The net/http package improperly accepts a bare LF as a line terminator in chunked data chunk-size lines. This can permit request smuggling if a net/http server is used in conjunction with a server that incorrectly accepts a bare LF as part of a chunk-ext.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-4673", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.10, 1.24.4", "title": "net/http: Sensitive headers not cleared on cross-origin redirect in net/http", "description": "Proxy-Authorization and Proxy-Authenticate headers persisted on cross-origin redirects potentially leaking sensitive information.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47906", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.12, 1.24.6", "title": "os/exec: Unexpected paths returned from LookPath in os/exec", "description": "If the PATH environment variable contains paths which are executables (rather than just directories), passing certain strings to LookPath (\"\", \".\", and \"..\"), can result in the binaries listed in the PATH being unexpectedly returned.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47912", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/url: Insufficient validation of bracketed IPv6 hostnames in net/url", "description": "The Parse function permits values other than IPv6 addresses to be included in square brackets within the host component of a URL. RFC 3986 permits IPv6 addresses to be included within the host component, enclosed within square brackets. For example: \"http://[::1]/\". IPv4 addresses and hostnames must not appear within square brackets. Parse did not enforce this requirement.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58185", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "encoding/asn1: Parsing DER payload can cause memory exhaustion in encoding/asn1", "description": "Parsing a maliciously crafted DER payload could allocate large amounts of memory, causing memory exhaustion.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58186", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "golang.org/net/http: Lack of limit when parsing cookies can cause memory exhaustion in net/http", "description": "Despite HTTP headers having a default limit of 1MB, the number of cookies that can be parsed does not have a limit. By sending a lot of very small cookies such as \"a=;\", an attacker can make an HTTP server allocate a large amount of structs, causing large memory consumption.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58187", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.9, 1.25.3", "title": "crypto/x509: Quadratic complexity when checking name constraints in crypto/x509", "description": "Due to the design of the name constraint checking algorithm, the processing time of some inputs scale non-linearly with respect to the size of the certificate. This affects programs which validate arbitrary certificate chains.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58188", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "crypto/x509: golang: Panic when validating certificates with DSA public keys in crypto/x509", "description": "Validating certificate chains which contain DSA public keys can cause programs to panic, due to a interface cast that assumes they implement the Equal method. This affects programs which validate arbitrary certificate chains.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58189", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "crypto/tls: go crypto/tls ALPN negotiation error contains attacker controlled information", "description": "When Conn.Handshake fails during ALPN negotiation the error contains attacker controlled information (the ALPN protocols sent by the client) which is not escaped.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61723", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "encoding/pem: Quadratic complexity when parsing some invalid inputs in encoding/pem", "description": "The processing time for parsing some invalid inputs scales non-linearly with respect to the size of the input. This affects programs which parse untrusted PEM inputs.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61724", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/textproto: Excessive CPU consumption in Reader.ReadResponse in net/textproto", "description": "The Reader.ReadResponse function constructs a response string through repeated string concatenation of lines. When the number of lines in a response is large, this can cause excessive CPU consumption.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61725", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/mail: Excessive CPU consumption in ParseAddress in net/mail", "description": "The ParseAddress function constructs domain-literal address components through repeated string concatenation. When parsing large domain-literal components, this can cause excessive CPU consumption.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61727", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.11, 1.25.5", "title": "golang: crypto/x509: excluded subdomain constraint does not restrict wildcard SANs", "description": "An excluded subdomain constraint in a certificate chain does not restrict the usage of wildcard SANs in the leaf certificate. For example a constraint that excludes the subdomain test.example.com does not prevent a leaf certificate from claiming the SAN *.example.com.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-35255", "severity": "MEDIUM", "package_name": "github.com/Azure/azure-sdk-for-go/sdk/azidentity", "installed_version": "v1.4.0", "fixed_version": "1.6.0-beta.4.0.20240610221955-50774cd97099", "title": "azure-identity: Azure Identity Libraries Elevation of Privilege Vulnerability in github.com/Azure/azure-sdk-for-go/sdk/azidentity", "description": "Azure Identity Libraries and Microsoft Authentication Library Elevation of Privilege Vulnerability", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-41110", "severity": "CRITICAL", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "23.0.15, 26.1.5, 27.1.1, 25.0.6", "title": "moby: Authz zero length regression", "description": "Moby is an open-source project created by Docker for software containerization. A security vulnerability has been detected in certain versions of Docker Engine, which could allow an attacker to bypass authorization plugins (AuthZ) under specific circumstances. The base likelihood of this being exploited is low.\n\nUsing a specially-crafted API request, an Engine API client could make the daemon forward the request or response to an authorization plugin without the body. In certain circumstances, the authorization plugin may allow a request which it would have otherwise denied if the body had been forwarded to it.\n\nA security issue was discovered In 2018, where an attacker could bypass AuthZ plugins using a specially crafted API request. This could lead to unauthorized actions, including privilege escalation. Although this issue was fixed in Docker Engine v18.09.1 in January 2019, the fix was not carried forward to later major versions, resulting in a regression. Anyone who depends on authorization plugins that introspect the request and/or response body to make access control decisions is potentially impacted.\n\nDocker EE v19.03.x and all versions of Mirantis Container Runtime are not vulnerable.\n\ndocker-ce v27.1.1 containes patches to fix the vulnerability. Patches have also been merged into the master, 19.03, 20.0, 23.0, 24.0, 25.0, 26.0, and 26.1 release branches. If one is unable to upgrade immediately, avoid using AuthZ plugins and/or restrict access to the Docker API to trusted parties, following the principle of least privilege.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24557", "severity": "MEDIUM", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "24.0.9, 25.0.2", "title": "moby: classic builder cache poisoning", "description": "Moby is an open-source project created by Docker to enable software containerization. The classic builder cache system is prone to cache poisoning if the image is built FROM scratch. Also, changes to some instructions (most important being HEALTHCHECK and ONBUILD) would not cause a cache miss. An attacker with the knowledge of the Dockerfile someone is using could poison their cache by making them pull a specially crafted image that would be considered as a valid cache candidate for some build steps. 23.0+ users are only affected if they explicitly opted out of Buildkit (DOCKER_BUILDKIT=0 environment variable) or are using the /build API endpoint. All users on versions older than 23.0 could be impacted. Image build API endpoint (/build) and ImageBuild function from github.com/docker/docker/client is also affected as it the uses classic builder by default. Patches are included in 24.0.9 and 25.0.2 releases.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "GHSA-jq35-85cj-fj4p", "severity": "MEDIUM", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "24.0.7, 23.0.8, 20.10.27", "title": "/sys/devices/virtual/powercap accessible by default to containers", "description": "Intel's RAPL (Running Average Power Limit) feature, introduced by the Sandy Bridge microarchitecture, provides software insights into hardware energy consumption. To facilitate this, Intel introduced the powercap framework in Linux kernel 3.13, which reads values via relevant MSRs (model specific registers) and provides unprivileged userspace access via `sysfs`. As RAPL is an interface to access a hardware feature, it is only available when running on bare metal with the module compiled into the kernel.\n\nBy 2019, it was realized that in some cases unprivileged access to RAPL readings could be exploited as a power-based side-channel against security features including AES-NI (potentially inside a SGX enclave) and KASLR (kernel address space layout randomization). Also known as the [PLATYPUS attack](https://platypusattack.com/), Intel assigned [CVE-2020-8694](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8694) and [CVE-2020-8695](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8695), and AMD assigned [CVE-2020-12912](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-12912).\n\nSeveral mitigations were applied; Intel reduced the sampling resolution via a microcode update, and the Linux kernel [prevents access by non-root users](https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=949dd0104c496fa7c14991a23c03c62e44637e71) since 5.10. However, this kernel-based mitigation does not apply to many container-based scenarios:\n* Unless using user namespaces, root inside a container has the same level of privilege as root outside the container, but with a slightly more narrow view of the system\n* `sysfs` is mounted inside containers read-only; however only read access is needed to carry out this attack on an unpatched CPU\n\nWhile this is not a direct vulnerability in container runtimes, defense in depth and safe defaults are valuable and preferred, especially as this poses a risk to multi-tenant container environments running directly on affected hardware. This is provided by masking `/sys/devices/virtual/powercap` in the default mount configuration, and adding an additional set of rules to deny it in the default AppArmor profile.\n\nWhile `sysfs` is not the only way to read from the RAPL subsystem, other ways of accessing it require additional capabilities such as `CAP_SYS_RAWIO` which is not available to containers by default, or `perf` paranoia level less than 1, which is a non-default kernel tunable.\n\n## References\n\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8694\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8695\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-12912\n* https://platypusattack.com/\n* https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=949dd0104c496fa7c14991a23c03c62e44637e71\n* https://web.eece.maine.edu/~vweaver/projects/rapl/", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-54410", "severity": "LOW", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "28.0.0", "title": "github.com/moby/moby: Moby's Firewalld reload removes bridge network isolation", "description": "Moby is an open source container framework developed by Docker Inc. that is distributed as Docker Engine, Mirantis Container Runtime, and various other downstream projects/products. A firewalld vulnerability affects Moby releases before 28.0.0. When firewalld reloads, Docker fails to re-create iptables rules that isolate bridge networks, allowing any container to access all ports on any other container across different bridge networks on the same host. This breaks network segmentation between containers that should be isolated, creating significant risk in multi-tenant environments. Only containers in --internal networks remain protected.\nWorkarounds include reloading firewalld and either restarting the docker daemon, re-creating bridge networks, or using rootless mode. Maintainers anticipate a fix for this issue in version 25.0.13.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-30204", "severity": "HIGH", "package_name": "github.com/golang-jwt/jwt/v5", "installed_version": "v5.0.0", "fixed_version": "5.2.2", "title": "golang-jwt/jwt: jwt-go allows excessive memory allocation during header parsing", "description": "golang-jwt is a Go implementation of JSON Web Tokens. Starting in version 3.2.0 and prior to versions 5.2.2 and 4.5.2, the function parse.ParseUnverified splits (via a call to strings.Split) its argument (which is untrusted data) on periods. As a result, in the face of a malicious request whose Authorization header consists of Bearer  followed by many period characters, a call to that function incurs allocations to the tune of O(n) bytes (where n stands for the length of the function's argument), with a constant factor of about 16. This issue is fixed in 5.2.2 and 4.5.2.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-6104", "severity": "MEDIUM", "package_name": "github.com/hashicorp/go-retryablehttp", "installed_version": "v0.7.4", "fixed_version": "0.7.7", "title": "go-retryablehttp: url might write sensitive information to log file", "description": "go-retryablehttp prior to 0.7.7 did not sanitize urls when writing them to its log file. This could lead to go-retryablehttp writing sensitive HTTP basic auth credentials to its log file. This vulnerability, CVE-2024-6104, was fixed in go-retryablehttp 0.7.7.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45337", "severity": "CRITICAL", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.31.0", "title": "golang.org/x/crypto/ssh: Misuse of ServerConfig.PublicKeyCallback may cause authorization bypass in golang.org/x/crypto", "description": "Applications and libraries which misuse connection.serverAuthenticate (via callback field ServerConfig.PublicKeyCallback) may be susceptible to an authorization bypass. The documentation for ServerConfig.PublicKeyCallback says that \"A call to this function does not guarantee that the key offered is in fact used to authenticate.\" Specifically, the SSH protocol allows clients to inquire about whether a public key is acceptable before proving control of the corresponding private key. PublicKeyCallback may be called with multiple keys, and the order in which the keys were provided cannot be used to infer which key the client successfully authenticated with, if any. Some applications, which store the key(s) passed to PublicKeyCallback (or derived information) and make security relevant determinations based on it once the connection is established, may make incorrect assumptions. For example, an attacker may send public keys A and B, and then authenticate with A. PublicKeyCallback would be called only twice, first with A and then with B. A vulnerable application may then make authorization decisions based on key B for which the attacker does not actually control the private key. Since this API is widely misused, as a partial mitigation golang.org/x/cry...@v0.31.0 enforces the property that, when successfully authenticating via public key, the last key passed to ServerConfig.PublicKeyCallback will be the key used to authenticate the connection. PublicKeyCallback will now be called multiple times with the same key, if necessary. Note that the client may still not control the last key passed to PublicKeyCallback if the connection is then authenticated with a different method, such as PasswordCallback, KeyboardInteractiveCallback, or NoClientAuth. Users should be using the Extensions field of the Permissions return value from the various authentication callbacks to record data associated with the authentication attempt instead of referencing external state. Once the connection is established the state corresponding to the successful authentication attempt can be retrieved via the ServerConn.Permissions field. Note that some third-party libraries misuse the Permissions type by sharing it across authentication attempts; users of third-party libraries should refer to the relevant projects for guidance.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22869", "severity": "HIGH", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.35.0", "title": "golang.org/x/crypto/ssh: Denial of Service in the Key Exchange of golang.org/x/crypto/ssh", "description": "SSH servers which implement file transfer protocols are vulnerable to a denial of service attack from clients which complete the key exchange slowly, or not at all, causing pending content to be read into memory, but never transmitted.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-48795", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.17.0, 0.0.0-20231218163308-9d2ee975ef9f", "title": "ssh: Prefix truncation attack on Binary Packet Protocol (BPP)", "description": "The SSH transport protocol with certain OpenSSH extensions, found in OpenSSH before 9.6 and other products, allows remote attackers to bypass integrity checks such that some packets are omitted (from the extension negotiation message), and a client and server may consequently end up with a connection for which some security features have been downgraded or disabled, aka a Terrapin attack. This occurs because the SSH Binary Packet Protocol (BPP), implemented by these extensions, mishandles the handshake phase and mishandles use of sequence numbers. For example, there is an effective attack against SSH's use of ChaCha20-Poly1305 (and CBC with Encrypt-then-MAC). The bypass occurs in chacha20-poly1305@openssh.com and (if CBC is used) the -etm@openssh.com MAC algorithms. This also affects Maverick Synergy Java SSH API before 3.1.0-SNAPSHOT, Dropbear through 2022.83, Ssh before 5.1.1 in Erlang/OTP, PuTTY before 0.80, AsyncSSH before 2.14.2, golang.org/x/crypto before 0.17.0, libssh before 0.10.6, libssh2 through 1.11.0, Thorn Tech SFTP Gateway before 3.4.6, Tera Term before 5.1, Paramiko before 3.4.0, jsch before 0.2.15, SFTPGo before 2.5.6, Netgate pfSense Plus through 23.09.1, Netgate pfSense CE through 2.7.2, HPN-SSH through 18.2.0, ProFTPD before 1.3.8b (and before 1.3.9rc2), ORYX CycloneSSH before 2.3.4, NetSarang XShell 7 before Build 0144, CrushFTP before 10.6.0, ConnectBot SSH library before 2.2.22, Apache MINA sshd through 2.11.0, sshj through 0.37.0, TinySSH through 20230101, trilead-ssh2 6401, LANCOM LCOS and LANconfig, FileZilla before 3.66.4, Nova before 11.8, PKIX-SSH before 14.4, SecureCRT before 9.4.3, Transmit5 before 5.10.4, Win32-OpenSSH before 9.5.0.0p1-Beta, WinSCP before 6.2.2, Bitvise SSH Server before 9.32, Bitvise SSH Client before 9.33, KiTTY through 0.76.1.13, the net-ssh gem 7.2.0 for Ruby, the mscdex ssh2 module before 1.15.0 for Node.js, the thrussh library before 0.35.1 for Rust, and the Russh crate before 0.40.2 for Rust.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47914", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.45.0", "title": "golang.org/x/crypto/ssh/agent: in golang.org/x/crypto/ssh/agent", "description": "SSH Agent servers do not validate the size of messages when processing new identity requests, which may cause the program to panic if the message is malformed due to an out of bounds read.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58181", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.45.0", "title": "golang.org/x/crypto/ssh: in golang.org/x/crypto/ssh", "description": "SSH servers parsing GSSAPI authentication requests do not validate the number of mechanisms specified in the request, allowing an attacker to cause unbounded memory consumption.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45288", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.23.0", "title": "golang: net/http, x/net/http2: unlimited number of CONTINUATION frames causes DoS", "description": "An attacker may cause an HTTP/2 endpoint to read arbitrary amounts of header data by sending an excessive number of CONTINUATION frames. Maintaining HPACK state requires parsing and processing all HEADERS and CONTINUATION frames on a connection. When a request's headers exceed MaxHeaderBytes, no memory is allocated to store the excess headers, but they are still parsed. This permits an attacker to cause an HTTP/2 endpoint to read arbitrary amounts of header data, all associated with a request which is going to be rejected. These headers can include Huffman-encoded data which is significantly more expensive for the receiver to decode than for an attacker to send. The fix sets a limit on the amount of excess header frames we will process before closing a connection.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22870", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.36.0", "title": "golang.org/x/net/proxy: golang.org/x/net/http/httpproxy: HTTP Proxy bypass using IPv6 Zone IDs in golang.org/x/net", "description": "Matching of hosts against proxy patterns can improperly treat an IPv6 zone ID as a hostname component. For example, when the NO_PROXY environment variable is set to \"*.example.com\", a request to \"[::1%25.example.com]:80` will incorrectly match and not be proxied.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22872", "severity": "MEDIUM", "package_name": "golang.org/x/net", "installed_version": "v0.17.0", "fixed_version": "0.38.0", "title": "golang.org/x/net/html: Incorrect Neutralization of Input During Web Page Generation in x/net in golang.org/x/net", "description": "The tokenizer incorrectly interprets tags with unquoted attribute values that end with a solidus character (/) as self-closing. When directly using Tokenizer, this can result in such tags incorrectly being marked as self-closing, and when using the Parse functions, this can result in content following such tags as being placed in the wrong scope during DOM construction, but only when tags are in foreign content (e.g. <math>, <svg>, etc contexts).", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22868", "severity": "HIGH", "package_name": "golang.org/x/oauth2", "installed_version": "v0.13.0", "fixed_version": "0.27.0", "title": "golang.org/x/oauth2/jws: Unexpected memory consumption during token parsing in golang.org/x/oauth2/jws", "description": "An attacker can pass a malicious malformed token which causes unexpected memory to be consumed during parsing.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24786", "severity": "MEDIUM", "package_name": "google.golang.org/protobuf", "installed_version": "v1.31.0", "fixed_version": "1.33.0", "title": "golang-protobuf: encoding/protojson, internal/encoding/json: infinite loop in protojson.Unmarshal when unmarshaling certain forms of invalid JSON", "description": "The protojson.Unmarshal function can enter an infinite loop when unmarshaling certain forms of invalid JSON. This condition can occur when unmarshaling into a message which contains a google.protobuf.Any value, or when the UnmarshalOptions.DiscardUnknown option is set.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24790", "severity": "CRITICAL", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.11, 1.22.4", "title": "golang: net/netip: Unexpected behavior from Is methods for IPv4-mapped IPv6 addresses", "description": "The various Is methods (IsPrivate, IsLoopback, etc) did not work as expected for IPv4-mapped IPv6 addresses, returning false for addresses which would return true in their traditional IPv4 forms.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45288", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.9, 1.22.2", "title": "golang: net/http, x/net/http2: unlimited number of CONTINUATION frames causes DoS", "description": "An attacker may cause an HTTP/2 endpoint to read arbitrary amounts of header data by sending an excessive number of CONTINUATION frames. Maintaining HPACK state requires parsing and processing all HEADERS and CONTINUATION frames on a connection. When a request's headers exceed MaxHeaderBytes, no memory is allocated to store the excess headers, but they are still parsed. This permits an attacker to cause an HTTP/2 endpoint to read arbitrary amounts of header data, all associated with a request which is going to be rejected. These headers can include Huffman-encoded data which is significantly more expensive for the receiver to decode than for an attacker to send. The fix sets a limit on the amount of excess header frames we will process before closing a connection.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34156", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "encoding/gob: golang: Calling Decoder.Decode on a message which contains deeply nested structures can cause a panic due to stack exhaustion", "description": "Calling Decoder.Decode on a message which contains deeply nested structures can cause a panic due to stack exhaustion. This is a follow-up to CVE-2022-30635.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47907", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.12, 1.24.6", "title": "database/sql: Postgres Scan Race Condition", "description": "Cancelling a query (e.g. by cancelling the context passed to one of the query methods) during a call to the Scan method of the returned Rows can result in unexpected results if other queries are being made in parallel. This can result in a race condition that may overwrite the expected results with those of another query, causing the call to Scan to return either unexpected results from the other query or an error.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58183", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "golang: archive/tar: Unbounded allocation when parsing GNU sparse map", "description": "tar.Reader does not set a maximum size on the number of sparse region data blocks in GNU tar pax 1.0 sparse files. A maliciously-crafted archive containing a large number of sparse regions can cause a Reader to read an unbounded amount of data from the archive into memory. When reading from a compressed source, a small compressed input can result in large allocations.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61729", "severity": "HIGH", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.11, 1.25.5", "title": "crypto/x509: Excessive resource consumption when printing error string for host certificate validation in crypto/x509", "description": "Within HostnameError.Error(), when constructing an error string, there is no limit to the number of hosts that will be printed out. Furthermore, the error string is constructed by repeated string concatenation, leading to quadratic runtime. Therefore, a certificate provided by a malicious actor can result in excessive resource consumption.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-39326", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.20.12, 1.21.5", "title": "golang: net/http/internal: Denial of Service (DoS) via Resource Consumption via HTTP requests", "description": "A malicious HTTP sender can use chunk extensions to cause a receiver reading from a request or response body to read many more bytes from the network than are in the body. A malicious HTTP client can further exploit this to cause a server to automatically read a large amount of data (up to about 1GiB) when a handler fails to read the entire body of a request. Chunk extensions are a little-used HTTP feature which permit including additional metadata in a request or response body sent using the chunked encoding. The net/http chunked encoding reader discards this metadata. A sender can exploit this by inserting a large metadata segment with each byte transferred. The chunk reader now produces an error if the ratio of real body to encoded bytes grows too small.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45289", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/http/cookiejar: incorrect forwarding of sensitive headers and cookies on HTTP redirect", "description": "When following an HTTP redirect to a domain which is not a subdomain match or exact match of the initial domain, an http.Client does not forward sensitive headers such as \"Authorization\" or \"Cookie\". For example, a redirect from foo.com to www.foo.com will forward the Authorization header, but a redirect to bar.com will not. A maliciously crafted HTTP redirect could cause sensitive headers to be unexpectedly forwarded.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-45290", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/http: golang: mime/multipart: golang: net/textproto: memory exhaustion in Request.ParseMultipartForm", "description": "When parsing a multipart form (either explicitly with Request.ParseMultipartForm or implicitly with Request.FormValue, Request.PostFormValue, or Request.FormFile), limits on the total size of the parsed form were not applied to the memory consumed while reading a single form line. This permits a maliciously crafted input containing very long lines to cause allocation of arbitrarily large amounts of memory, potentially leading to memory exhaustion. With fix, the ParseMultipartForm function now correctly limits the maximum size of form lines.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24783", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: crypto/x509: Verify panics on certificates with an unknown public key algorithm", "description": "Verifying a certificate chain which contains a certificate with an unknown public key algorithm will cause Certificate.Verify to panic. This affects all crypto/tls clients, and servers that set Config.ClientAuth to VerifyClientCertIfGiven or RequireAndVerifyClientCert. The default behavior is for TLS servers to not verify client certificates.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24784", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: net/mail: comments in display names are incorrectly handled", "description": "The ParseAddressList function incorrectly handles comments (text within parentheses) within display names. Since this is a misalignment with conforming address parsers, it can result in different trust decisions being made by programs using different parsers.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24785", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.8, 1.22.1", "title": "golang: html/template: errors returned from MarshalJSON methods may break template escaping", "description": "If errors returned from MarshalJSON methods contain user controlled data, they may be used to break the contextual auto-escaping behavior of the html/template package, allowing for subsequent actions to inject unexpected content into templates.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24789", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.11, 1.22.4", "title": "golang: archive/zip: Incorrect handling of certain ZIP files", "description": "The archive/zip package's handling of certain types of invalid zip files differs from the behavior of most zip implementations. This misalignment could be exploited to create an zip file with contents that vary depending on the implementation reading the file. The archive/zip package now rejects files containing these errors.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24791", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.21.12, 1.22.5", "title": "net/http: Denial of service due to improper 100-continue handling in net/http", "description": "The net/http HTTP/1.1 client mishandled the case where a server responds to a request with an \"Expect: 100-continue\" header with a non-informational (200 or higher) status. This mishandling could leave a client connection in an invalid state, where the next request sent on the connection will fail. An attacker sending a request to a net/http/httputil.ReverseProxy proxy can exploit this mishandling to cause a denial of service by sending \"Expect: 100-continue\" requests which elicit a non-informational response from the backend. Each such request leaves the proxy with an invalid connection, and causes one subsequent request using that connection to fail.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34155", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "go/parser: golang: Calling any of the Parse functions containing deeply nested literals can cause a panic/stack exhaustion", "description": "Calling any of the Parse functions on Go source code which contains deeply nested literals can cause a panic due to stack exhaustion.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-34158", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.7, 1.23.1", "title": "go/build/constraint: golang: Calling Parse on a \"// +build\" build tag line with deeply nested expressions can cause a panic due to stack exhaustion", "description": "Calling Parse on a \"// +build\" build tag line with deeply nested expressions can cause a panic due to stack exhaustion.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45336", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.11, 1.23.5, 1.24.0-rc.2", "title": "golang: net/http: net/http: sensitive headers incorrectly sent after cross-domain redirect", "description": "The HTTP client drops sensitive headers after following a cross-domain redirect. For example, a request to a.com/ containing an Authorization header which is redirected to b.com/ will not send that header to b.com. In the event that the client received a subsequent same-domain redirect, however, the sensitive headers would be restored. For example, a chain of redirects from a.com/, to b.com/1, and finally to b.com/2 would incorrectly send the Authorization header to b.com/2.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45341", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.11, 1.23.5, 1.24.0-rc.2", "title": "golang: crypto/x509: crypto/x509: usage of IPv6 zone IDs can bypass URI name constraints", "description": "A certificate with a URI which has a IPv6 address with a zone ID may incorrectly satisfy a URI name constraint that applies to the certificate chain. Certificates containing URIs are not permitted in the web PKI, so this only affects users of private PKIs which make use of URIs.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-0913", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.10, 1.24.4", "title": "Inconsistent handling of O_CREATE|O_EXCL on Unix and Windows in os in syscall", "description": "os.OpenFile(path, os.O_CREATE|O_EXCL) behaved differently on Unix and Windows systems when the target path was a dangling symlink. On Unix systems, OpenFile with O_CREATE and O_EXCL flags never follows symlinks. On Windows, when the target path was a symlink to a nonexistent location, OpenFile would create a file in that location. OpenFile now always returns an error when the O_CREATE and O_EXCL flags are both set and the target path is a symlink.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22866", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.22.12, 1.23.6, 1.24.0-rc.3", "title": "crypto/internal/nistec: golang: Timing sidechannel for P-256 on ppc64le in crypto/internal/nistec", "description": "Due to the usage of a variable time instruction in the assembly implementation of an internal function, a small number of bits of secret scalars are leaked on the ppc64le architecture. Due to the way this function is used, we do not believe this leakage is enough to allow recovery of the private key when P-256 is used in any well known protocols.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22871", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.8, 1.24.2", "title": "net/http: Request smuggling due to acceptance of invalid chunked data in net/http", "description": "The net/http package improperly accepts a bare LF as a line terminator in chunked data chunk-size lines. This can permit request smuggling if a net/http server is used in conjunction with a server that incorrectly accepts a bare LF as part of a chunk-ext.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-4673", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.10, 1.24.4", "title": "net/http: Sensitive headers not cleared on cross-origin redirect in net/http", "description": "Proxy-Authorization and Proxy-Authenticate headers persisted on cross-origin redirects potentially leaking sensitive information.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47906", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.23.12, 1.24.6", "title": "os/exec: Unexpected paths returned from LookPath in os/exec", "description": "If the PATH environment variable contains paths which are executables (rather than just directories), passing certain strings to LookPath (\"\", \".\", and \"..\"), can result in the binaries listed in the PATH being unexpectedly returned.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-47912", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/url: Insufficient validation of bracketed IPv6 hostnames in net/url", "description": "The Parse function permits values other than IPv6 addresses to be included in square brackets within the host component of a URL. RFC 3986 permits IPv6 addresses to be included within the host component, enclosed within square brackets. For example: \"http://[::1]/\". IPv4 addresses and hostnames must not appear within square brackets. Parse did not enforce this requirement.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58185", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "encoding/asn1: Parsing DER payload can cause memory exhaustion in encoding/asn1", "description": "Parsing a maliciously crafted DER payload could allocate large amounts of memory, causing memory exhaustion.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58186", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "golang.org/net/http: Lack of limit when parsing cookies can cause memory exhaustion in net/http", "description": "Despite HTTP headers having a default limit of 1MB, the number of cookies that can be parsed does not have a limit. By sending a lot of very small cookies such as \"a=;\", an attacker can make an HTTP server allocate a large amount of structs, causing large memory consumption.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58187", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.9, 1.25.3", "title": "crypto/x509: Quadratic complexity when checking name constraints in crypto/x509", "description": "Due to the design of the name constraint checking algorithm, the processing time of some inputs scale non-linearly with respect to the size of the certificate. This affects programs which validate arbitrary certificate chains.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58188", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "crypto/x509: golang: Panic when validating certificates with DSA public keys in crypto/x509", "description": "Validating certificate chains which contain DSA public keys can cause programs to panic, due to a interface cast that assumes they implement the Equal method. This affects programs which validate arbitrary certificate chains.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-58189", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "crypto/tls: go crypto/tls ALPN negotiation error contains attacker controlled information", "description": "When Conn.Handshake fails during ALPN negotiation the error contains attacker controlled information (the ALPN protocols sent by the client) which is not escaped.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61723", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "encoding/pem: Quadratic complexity when parsing some invalid inputs in encoding/pem", "description": "The processing time for parsing some invalid inputs scales non-linearly with respect to the size of the input. This affects programs which parse untrusted PEM inputs.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61724", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/textproto: Excessive CPU consumption in Reader.ReadResponse in net/textproto", "description": "The Reader.ReadResponse function constructs a response string through repeated string concatenation of lines. When the number of lines in a response is large, this can cause excessive CPU consumption.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61725", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.8, 1.25.2", "title": "net/mail: Excessive CPU consumption in ParseAddress in net/mail", "description": "The ParseAddress function constructs domain-literal address components through repeated string concatenation. When parsing large domain-literal components, this can cause excessive CPU consumption.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-61727", "severity": "MEDIUM", "package_name": "stdlib", "installed_version": "v1.21.4", "fixed_version": "1.24.11, 1.25.5", "title": "golang: crypto/x509: excluded subdomain constraint does not restrict wildcard SANs", "description": "An excluded subdomain constraint in a certificate chain does not restrict the usage of wildcard SANs in the leaf certificate. For example a constraint that excludes the subdomain test.example.com does not prevent a leaf certificate from claiming the SAN *.example.com.", "target": "bin/promtool", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2011-3374", "severity": "LOW", "package_name": "apt", "installed_version": "3.0.3", "fixed_version": "Not available", "title": "It was found that apt-key in apt, all versions, do not correctly valid ...", "description": "It was found that apt-key in apt, all versions, do not correctly validate gpg keys with the master keyring, leading to a potential man-in-the-middle attack.", "target": "10x-devops-assignment-sensor-service (debian 13.2)", "image": "10x-devops-assignment-sensor-service"}, {"cve_id": "TEMP-0841856-B18BAF", "severity": "LOW", "package_name": "bash", "installed_version": "5.2.37-2+b5", "fixed_version": "Not available", "title": "[Privilege escalation possible to other user than root]", "description": "No description", "target": "10x-devops-assignment-sensor-service (debian 13.2)", "image": "10x-devops-assignment-sensor-service"}, {"cve_id": "CVE-2025-14104", "severity": "MEDIUM", "package_name": "bsdutils", "installed_version": "1:2.41-5", "fixed_version": "Not available", "title": "util-linux: util-linux: Heap buffer overread in setpwnam() when processing 256-byte usernames", "description": "A flaw was found in util-linux. This vulnerability allows a heap buffer overread when processing 256-byte usernames, specifically within the `setpwnam()` function, affecting SUID (Set User ID) login-utils utilities writing to the password database.", "target": "10x-devops-assignment-sensor-service (debian 13.2)", "image": "10x-devops-assignment-sensor-service"}, {"cve_id": "CVE-2022-0563", "severity": "LOW", "package_name": "bsdutils", "installed_version": "1:2.41-5", "fixed_version": "Not available", "title": "util-linux: partial disclosure of arbitrary files in chfn and chsh when compiled with libreadline", "description": "A flaw was found in the util-linux chfn and chsh utilities when compiled with Readline support. The Readline library uses an \"INPUTRC\" environment variable to get a path to the library config file. When the library cannot parse the specified file, it prints an error message containing data from the file. This flaw allows an unprivileged user to read root-owned files, potentially leading to privilege escalation. This flaw affects util-linux versions prior to 2.37.4.", "target": "10x-devops-assignment-sensor-service (debian 13.2)", "image": "10x-devops-assignment-sensor-service"}, {"cve_id": "CVE-2017-18018", "severity": "LOW", "package_name": "coreutils", "installed_version": "9.7-3", "fixed_version": "Not available", "title": "coreutils: race condition vulnerability in chown and chgrp", "description": "In GNU Coreutils through 8.29, chown-core.c in chown and chgrp does not prevent replacement of a plain file with a symlink during use of the POSIX \"-R -L\" options, which allows local users to modify the ownership of arbitrary files by leveraging a race condition.", "target": "10x-devops-assignment-sensor-service (debian 13.2)", "image": "10x-devops-assignment-sensor-service"}, {"cve_id": "CVE-2025-5278", "severity": "LOW", "package_name": "coreutils", "installed_version": "9.7-3", "fixed_version": "Not available", "title": "coreutils: Heap Buffer Under-Read in GNU Coreutils sort via Key Specification", "description": "A flaw was found in GNU Coreutils. The sort utility's begfield() function is vulnerable to a heap buffer under-read. The program may access memory outside the allocated buffer if a user runs a crafted command using the traditional key format. A malicious input could lead t const comparison = null;

let page = 1;
const size = 10;
let chart = null;

// Populate image dropdown
const imageFilter = document.getElementById("imageFilter");
const images = [...new Set(vulns.map(v => v.image))];
images.forEach(img => {
  const opt = document.createElement("option");
  opt.value = img;
  opt.textContent = img;
  imageFilter.appendChild(opt);
});

function getFilteredData() {
  const sev = document.getElementById("severityFilter").value;
  const img = document.getElementById("imageFilter").value;

  return vulns.filter(v => {
    const sevMatch = sev === "ALL" || v.severity === sev;
    const imgMatch = img === "ALL" || v.image === img;
    return sevMatch && imgMatch;
  });
}

function updateSummary(data) {
  const count = {CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0};
  data.forEach(v => count[v.severity]++);

  document.getElementById("sumCritical").innerText = count.CRITICAL;
  document.getElementById("sumHigh").innerText = count.HIGH;
  document.getElementById("sumMedium").innerText = count.MEDIUM;
  document.getElementById("sumLow").innerText = count.LOW;
  document.getElementById("sumTotal").innerText = data.length;

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("summaryChart"), {
    type: "bar",
    data: {
      labels: ["CRITICAL","HIGH","MEDIUM","LOW"],
      datasets: [{
        label: "Vulnerabilities",
        data: [count.CRITICAL, count.HIGH, count.MEDIUM, count.LOW],
        backgroundColor: ["red","orange","gold","green"]
      }]
    }
  });
}

function renderTable() {
  const data = getFilteredData();
  updateSummary(data);

  const start = (page - 1) * size;
  const rows = data.slice(start, start + size);
  const t = document.getElementById("table");
  t.innerHTML = "";

  rows.forEach(v => t.innerHTML += `
<tr>
<td>${v.image}</td>
<td>${v.cve_id}</td>
<td class="${v.severity}">${v.severity}</td>
<td>${v.package_name}</td>
<td>${v.installed_version}</td>
<td>${v.fixed_version}</td>
</tr>`);

  renderPages(data.length);
}

function renderPages(total) {
  const pages = Math.ceil(total / size);
  const c = document.getElementById("pagination");
  c.innerHTML = "";
  for (let i = 1; i <= pages; i++) {
    c.innerHTML += `<button onclick="go(${i})">${i}</button>`;
  }
}

function go(i) {
  page = i;
  renderTable();
}

document.getElementById("severityFilter").onchange = () => { page = 1; renderTable(); };
document.getElementById("imageFilter").onchange = () => { page = 1; renderTable(); };

// CSV Export
function exportCSV() {
  const data = getFilteredData();
  let csv = "Image,CVE,Severity,Package,Installed,Fixed\n";
  data.forEach(v => {
    csv += `${v.image},${v.cve_id},${v.severity},${v.package_name},${v.installed_version},${v.fixed_version}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "security_report.csv";
  a.click();
  window.URL.revokeObjectURL(url);
}

if (comparison) {
  document.getElementById("comparisonSection").style.display = "block";
  document.getElementById("cCrit").innerText = comparison.reduction_percentage.critical + "%";
  document.getElementById("cHigh").innerText = comparison.reduction_percentage.high + "%";
  document.getElementById("cMed").innerText = comparison.reduction_percentage.medium + "%";
  document.getElementById("cLow").innerText = comparison.reduction_percentage.low + "%";
}

renderTable();
</script>
