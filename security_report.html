e": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-9230", "severity": "MEDIUM", "package_name": "libcrypto3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.4-r0", "title": "openssl: Out-of-bounds read & write in RFC 3211 KEK Unwrap", "description": "Issue summary: An application trying to decrypt CMS messages encrypted using\npassword based encryption can trigger an out-of-bounds read and write.\n\nImpact summary: This out-of-bounds read may trigger a crash which leads to\nDenial of Service for an application. The out-of-bounds write can cause\na memory corruption which can have various consequences including\na Denial of Service or Execution of attacker-supplied code.\n\nAlthough the consequences of a successful exploit of this vulnerability\ncould be severe, the probability that the attacker would be able to\nperform it is low. Besides, password based (PWRI) encryption support in CMS\nmessages is very rarely used. For that reason the issue was assessed as\nModerate severity according to our Security Policy.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as the CMS implementation is outside the OpenSSL FIPS module\nboundary.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-9231", "severity": "MEDIUM", "package_name": "libcrypto3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.4-r0", "title": "openssl: Timing side-channel in SM2 algorithm on 64 bit ARM", "description": "Issue summary: A timing side-channel which could potentially allow remote\nrecovery of the private key exists in the SM2 algorithm implementation on 64 bit\nARM platforms.\n\nImpact summary: A timing side-channel in SM2 signature computations on 64 bit\nARM platforms could allow recovering the private key by an attacker..\n\nWhile remote key recovery over a network was not attempted by the reporter,\ntiming measurements revealed a timing signal which may allow such an attack.\n\nOpenSSL does not directly support certificates with SM2 keys in TLS, and so\nthis CVE is not relevant in most TLS contexts.  However, given that it is\npossible to add support for such certificates via a custom provider, coupled\nwith the fact that in such a custom provider context the private key may be\nrecoverable via remote timing measurements, we consider this to be a Moderate\nseverity issue.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as SM2 is not an approved algorithm.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-9232", "severity": "LOW", "package_name": "libcrypto3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.4-r0", "title": "openssl: Out-of-bounds read in HTTP client no_proxy handling", "description": "Issue summary: An application using the OpenSSL HTTP client API functions may\ntrigger an out-of-bounds read if the 'no_proxy' environment variable is set and\nthe host portion of the authority component of the HTTP URL is an IPv6 address.\n\nImpact summary: An out-of-bounds read can trigger a crash which leads to\nDenial of Service for an application.\n\nThe OpenSSL HTTP client API functions can be used directly by applications\nbut they are also used by the OCSP client functions and CMP (Certificate\nManagement Protocol) client implementation in OpenSSL. However the URLs used\nby these implementations are unlikely to be controlled by an attacker.\n\nIn this vulnerable code the out of bounds read can only trigger a crash.\nFurthermore the vulnerability requires an attacker-controlled URL to be\npassed from an application to the OpenSSL function and the user has to have\na 'no_proxy' environment variable set. For the aforementioned reasons the\nissue was assessed as Low severity.\n\nThe vulnerable code was introduced in the following patch releases:\n3.0.16, 3.1.8, 3.2.4, 3.3.3, 3.4.0 and 3.5.0.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as the HTTP client implementation is outside the OpenSSL FIPS module\nboundary.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-4575", "severity": "UNKNOWN", "package_name": "libcrypto3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.1-r0", "title": "Issue summary: Use of -addreject option with the openssl x509 applicat ...", "description": "Issue summary: Use of -addreject option with the openssl x509 application adds\na trusted use instead of a rejected use for a certificate.\n\nImpact summary: If a user intends to make a trusted certificate rejected for\na particular use it will be instead marked as trusted for that use.\n\nA copy & paste error during minor refactoring of the code introduced this\nissue in the OpenSSL 3.5 version. If, for example, a trusted CA certificate\nshould be trusted only for the purpose of authenticating TLS servers but not\nfor CMS signature verification and the CMS signature verification is intended\nto be marked as rejected with the -addreject option, the resulting CA\ncertificate will be trusted for CMS signature verification purpose instead.\n\nOnly users which use the trusted certificate format who use the openssl x509\ncommand line application to add rejected uses are affected by this issue.\nThe issues affecting only the command line application are considered to\nbe Low severity.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue.\n\nOpenSSL 3.4, 3.3, 3.2, 3.1, 3.0, 1.1.1 and 1.0.2 are also not affected by this\nissue.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-9230", "severity": "MEDIUM", "package_name": "libssl3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.4-r0", "title": "openssl: Out-of-bounds read & write in RFC 3211 KEK Unwrap", "description": "Issue summary: An applic  the private key may be\nrecoverable via remote timing measurements, we consider this to be a Moderate\nseverity issue.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as SM2 is not an approved algorithm.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-9232", "severity": "LOW", "package_name": "libssl3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.4-r0", "title": "openssl: Out-of-bounds read in HTTP client no_proxy handling", "description": "Issue summary: An application using the OpenSSL HTTP client API functions may\ntrigger an out-of-bounds read if the 'no_proxy' environment variable is set and\nthe host portion of the authority component of the HTTP URL is an IPv6 address.\n\nImpact summary: An out-of-bounds read can trigger a crash which leads to\nDenial of Service for an application.\n\nThe OpenSSL HTTP client API functions can be used directly by applications\nbut they are also used by the OCSP client functions and CMP (Certificate\nManagement Protocol) client implementation in OpenSSL. However the URLs used\nby these implementations are unlikely to be controlled by an attacker.\n\nIn this vulnerable code the out of bounds read can only trigger a crash.\nFurthermore the vulnerability requires an attacker-controlled URL to be\npassed from an application to the OpenSSL function and the user has to have\na 'no_proxy' environment variable set. For the aforementioned reasons the\nissue was assessed as Low severity.\n\nThe vulnerable code was introduced in the following patch releases:\n3.0.16, 3.1.8, 3.2.4, 3.3.3, 3.4.0 and 3.5.0.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as the HTTP client implementation is outside the OpenSSL FIPS module\nboundary.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-4575", "severity": "UNKNOWN", "package_name": "libssl3", "installed_version": "3.5.0-r0", "fixed_version": "3.5.1-r0", "title": "Issue summary: Use of -addreject option with the openssl x509 applicat ...", "description": "Issue summary: Use of -addreject option with the openssl x509 application adds\na trusted use instead of a rejected use for a certificate.\n\nImpact summary: If a user intends to make a trusted certificate rejected for\na particular use it will be instead marked as trusted for that use.\n\nA copy & paste error during minor refactoring of the code introduced this\nissue in the OpenSSL 3.5 version. If, for example, a trusted CA certificate\nshould be trusted only for the purpose of authenticating TLS servers but not\nfor CMS signature verification and the CMS signature verification is intended\nto be marked as rejected with the -addreject option, the resulting CA\ncertificate will be trusted for CMS signature verification purpose instead.\n\nOnly users which use the trusted certificate format who use the openssl x509\ncommand line application to add rejected uses are affected by this issue.\nThe issues affecting only the command line application are considered to\nbe Low severity.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue.\n\nOpenSSL 3.4, 3.3, 3.2, 3.1, 3.0, 1.1.1 and 1.0.2 are also not affected by this\nissue.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-58251", "severity": "MEDIUM", "package_name": "ssl_client", "installed_version": "1.37.0-r18", "fixed_version": "1.37.0-r20", "title": "In netstat in BusyBox through 1.37.0, local users can launch of networ ...", "description": "In netstat in BusyBox through 1.37.0, local users can launch of network application with an argv[0] containing an ANSI terminal escape sequence, leading to a denial of service (terminal locked up) when netstat is used by a victim.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-46394", "severity": "LOW", "package_name": "ssl_client", "installed_version": "1.37.0-r18", "fixed_version": "1.37.0-r20", "title": "In tar in BusyBox through 1.37.0, a TAR archive can have filenames hid ...", "description": "In tar in BusyBox through 1.37.0, a TAR archive can have filenames hidden from a listing through the use of terminal escape sequences.", "target": "wastemanagementsystem-app (alpine 3.22.0)", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-5889", "severity": "LOW", "package_name": "brace-expansion", "installed_version": "2.0.1", "fixed_version": "2.0.2, 1.1.12, 3.0.1, 4.0.1", "title": "brace-expansion: juliangruber brace-expansion index.js expand redos", "description": "A vulnerability was found in juliangruber brace-expansion up to 1.1.11/2.0.1/3.0.0/4.0.0. It has been rated as problematic. Affected by this issue is the function expand of the file index.js. The manipulation leads to inefficient regular expression complexity. The attack may be launched remotely. The complexity of an attack is rather high. The exploitation is known to be difficult. The exploit has been disclosed to the public and may be used. Upgrading to version 1.1.12, 2.0.2, 3.0.1 and 4.0.1 is able to address this issue. The name of the patch is a5b98a4f30d7813266b221435e1eaaf25a1b0ac5. It is recommended to upgrade the affected component.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21538", "severity": "HIGH", "package_name": "cross-spawn", "installed_version": "7.0.3", "fixed_version": "7.0.5, 6.0.6", "title": "cross-spawn: regular expression denial of service", "description": "Versions of the package cross-spawn before 6.0.6, from 7.0.0 and before 7.0.5 are vulnerable to Regular Expression Denial of Service (ReDoS) due to improper input sanitization. An attacker can increase the CPU usage and crash the program by crafting a very large and well crafted string.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-64756", "severity": "HIGH", "package_name": "glob", "installed_version": "10.4.2", "fixed_version": "11.1.0, 10.5.0", "title": "glob: glob: Command Injection Vulnerability via Malicious Filenames", "description": "Glob matches files using patterns the shell uses. Starting in version 10.2.0 and prior to versions 10.5.0 and 11.1.0, the glob CLI contains a command injection vulnerability in its -c/--cmd option that allows arbitrary command execution when processing files with malicious names. When glob -c <command> <patterns> are used, matched filenames are passed to a shell with shell: true, enabling shell metacharacters in filenames to trigger command injection and achieve arbitrary code execution under the user or CI account privileges. This issue has been patched in versions 10.5.0 and 11.1.0.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21508", "severity": "CRITICAL", "package_name": "mysql2", "installed_version": "2.3.3", "fixed_version": "3.9.4", "title": "mysql2: Remote Code Execution", "description": "Versions of the package mysql2 before 3.9.4 are vulnerable to Remote Code Execution (RCE) via the readCodeFor function due to improper validation of the supportBigNumbers and bigNumberStrings values.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21511", "severity": "CRITICAL", "package_name": "mysql2", "installed_version": "2.3.3", "fixed_version": "3.9.7", "title": "mysql2: Arbitrary Code Injection due to improper sanitization of the timezone parameter", "description": "Versions of the package mysql2 before 3.9.7 are vulnerable to Arbitrary Code Injection due to improper sanitization of the timezone parameter in the readCodeFor function by calling a native MySQL Server date/time function.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21512", "severity": "HIGH", "package_name": "mysql2", "installed_version": "2.3.3", "fixed_version": "3.9.8", "title": "mysql2: vulnerable to Prototype Pollution due to improper user input sanitization", "description": "Versions of the package mysql2 before 3.9.8 are vulnerable to Prototype Pollution due to improper user input sanitization passed to fields and tables when using nestTables.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21507", "severity": "MEDIUM", "package_name": "mysql2", "installed_version": "2.3.3", "fixed_version": "3.9.3", "title": "mysql2: Improper Input Validation", "description": "Versions of the package mysql2 before 3.9.3 are vulnerable to Improper Input Validation through the keyFromFields function, resulting in cache poisoning. An attacker can inject a colon (:) character within a value of the attacker-crafted key.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2024-21509", "severity": "MEDIUM", "package_name": "mysql2", "installed_version": "2.3.3", "fixed_version": "3.9.4", "title": "mysql2: Prototype Poisoning", "description": "Versions of the package mysql2 before 3.9.4 are vulnerable to Prototype Poisoning due to insecure results object creation and improper user input sanitization passed through parserFn in text_parser.js and binary_parser.js.", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-15284", "severity": "HIGH", "package_name": "qs", "installed_version": "6.13.0", "fixed_version": "6.14.1", "title": "qs: qs: Denial of Service via improper input validation in array parsing", "description": "Improper Input Validation vulnerability in qs (parse modules) allows HTTP DoS.This issue affects qs: < 6.14.1.\n\n\nSummaryThe arrayLimit\u00c2\u00a0option in qs does not enforce limits for bracket notation (a[]=1&a[]=2), allowing attackers to cause denial-of-service via memory exhaustion. Applications using arrayLimit\u00c2\u00a0for DoS protection are vulnerable.\n\nDetailsThe arrayLimit\u00c2\u00a0option only checks limits for indexed notation (a[0]=1&a[1]=2) but completely bypasses it for bracket notation (a[]=1&a[]=2).\n\nVulnerable code\u00c2\u00a0(lib/parse.js:159-162):\n\nif (root === '[]' && options.parseArrays) {\n    obj = utils.combine([], leaf);  // No arrayLimit check\n}\n\n\n\n\n\nWorking code\u00c2\u00a0(lib/parse.js:175):\n\nelse if (index <= options.arrayLimit) {  // Limit checked here\n    obj = [];\n    obj[index] = leaf;\n}\n\n\n\n\n\nThe bracket notation handler at line 159 uses utils.combine([], leaf)\u00c2\u00a0without validating against options.arrayLimit, while indexed notation at line 175 checks index <= options.arrayLimit\u00c2\u00a0before creating arrays.\n\nPoCTest 1 - Basic bypass:\n\nnpm install qs\n\n\n\n\n\nconst qs = require('qs');\nconst result = qs.parse('a[]=1&a[]=2&a[]=3&a[]=4&a[]=5&a[]=6', { arrayLimit: 5 });\nconsole.log(result.a.length);  // Output: 6 (should be max 5)\n\n\n\n\n\nTest 2 - DoS demonstration:\n\nconst qs = require('qs');\nconst attack = 'a[]=' + Array(10000).fill('x').join('&a[]=');\nconst result = qs.parse(attack, { arrayLimit: 100 });\nconsole.log(result.a.length);  // Output: 10000 (should be max 100)\n\n\n\n\n\nConfiguration:\n\n  *  arrayLimit: 5\u00c2\u00a0(test 1) or arrayLimit: 100\u00c2\u00a0(test 2)\n  *  Use bracket notation: a[]=value\u00c2\u00a0(not indexed a[0]=value)\n\n\nImpactDenial of Service via memory exhaustion. Affects applications using qs.parse()\u00c2\u00a0with user-controlled input and arrayLimit\u00c2\u00a0for protection.\n\nAttack scenario:\n\n  *  Attacker sends HTTP request: GET /api/search?filters[]=x&filters[]=x&...&filters[]=x\u00c2\u00a0(100,000+ times)\n  *  Application parses with qs.parse(query, { arrayLimit: 100 })\n  *  qs ignores limit, parses all 100,000 elements into array\n  *  Server memory exhausted \u00e2\u2020\u2019 application crashes or becomes unresponsive\n  *  Service unavailable for all users\nReal-world impact:\n\n  *  Single malicious request can crash server\n  *  No authentication required\n  *  Easy to automate and scale\n  *  Affects any endpoint parsing query strings with bracket notation", "target": "Node.js", "image": "wastemanagementsystem-app"}, {"cve_id": "CVE-2025-11082", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils Linker heap-based overflow", "description": "A flaw has been found in GNU Binutils 2.45. Impacted is the function _bfd_elf_parse_eh_frame of the file bfd/elf-eh-frame.c of the component Linker. Executing manipulation can lead to heap-based buffer overflow. The attack is restricted to local execution. The exploit has been published and may be used. This patch is called ea1a0737c7692737a644af0486b71e4a392cbca8. A patch should be applied to remediate this issue. The code maintainer replied with \"[f]ixed for 2.46\".", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11083", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils Linker heap-based overflow", "description": "A vulnerability has been found in GNU Binutils 2.45. The affected element is the function elf_swap_shdr in the library bfd/elfcode.h of the component Linker. The manipulation leads to heap-based buffer overflow. The attack must be carried out locally. The exploit has been disclosed to the public and may be used. The identifier of the patch is 9ca499644a21ceb3f946d1c179c38a83be084490. To fix this issue, it is recommended to deploy a patch. The code maintainer replied with \"[f]ixed for 2.46\".", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11412", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.8", "title": "binutils: GNU Binutils Linker elflink.c bfd_elf_gc_record_vtentry out-of-bounds", "description": "A vulnerability has been found in GNU Binutils 2.45. This impacts the function bfd_elf_gc_record_vtentry of the file bfd/elflink.c of the component Linker. The manipulation leads to out-of-bounds read. Local access is required to approach this attack. The exploit has been disclosed to the public and may be used. The identifier of the patch is 047435dd988a3975d40c6626a8f739a0b2e154bc. To fix this issue, it is recommended to deploy a patch.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11413", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.8", "title": "binutils: GNU Binutils Linker elflink.c elf_link_add_object_symbols out-of-bounds", "description": "A vulnerability was found in GNU Binutils 2.45. Affected is the function elf_link_add_object_symbols of the file bfd/elflink.c of the component Linker. The manipulation results in out-of-bounds read. The attack needs to be approached locally. The exploit has been made public and could be used. Upgrading to version 2.46 is able to address this issue. The patch is identified as 72efdf166aa0ed72ecc69fc2349af6591a7a19c0. Upgrading the affected component is advised.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11414", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.8", "title": "binutils: GNU Binutils Linker elflink.c get_link_hash_entry out-of-bounds", "description": "A vulnerability was determined in GNU Binutils 2.45. Affected by this vulnerability is the function get_link_hash_entry of the file bfd/elflink.c of the component Linker. This manipulation causes out-of-bounds read. The attack can only be executed locally. The exploit has been publicly disclosed and may be utilized. Upgrading to version 2.46 addresses this issue. Patch name: aeaaa9af6359c8e394ce9cf24911fec4f4d23703. It is advisable to upgrade the affected component.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-1147", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils nm nm.c internal_strlen buffer overflow", "description": "A vulnerability has been found in GNU Binutils 2.43 and classified as problematic. Affected by this vulnerability is the function __sanitizer::internal_strlen of the file binutils/nm.c of the component nm. The manipulation of the argument const leads to buffer overflow. The attack can be launched remotely. The complexity of an attack is rather high. The exploitation appears to be difficult. The exploit has been disclosed to the public and may be used.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-1148", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils ld ldelfgen.c link_order_scan memory leak", "description": "A vulnerability was found in GNU Binutils 2.43 and classified as problematic. Affected by this issue is the function link_order_scan of the file ld/ldelfgen.c of the component ld. The manipulation leads to memory leak. The attack may be launched remotely. The complexity of an attack is rather high. The exploitation is known to be difficult. The exploit has been disclosed to the public and may be used. It is recommended to apply a patch to fix this issue. The code maintainer explains: \"I'm not going to commit some of the leak fixes I've been working on to the 2.44 branch due to concern that would destabilise ld. All of the reported leaks in this bugzilla have been fixed on binutils master.\"", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11494", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.8", "title": "binutils: GNU Binutils Linker out-of-bounds read", "description": "A vulnerability was found in GNU Binutils 2.45. Impacted is the function _bfd_x86_elf_late_size_sections of the file bfd/elfxx-x86.c of the component Linker. The manipulation results in out-of-bounds read. The attack needs to be approached locally. The exploit has been made public and could be used. The patch is identified as b6ac5a8a5b82f0ae6a4642c8d7149b325f4cc60a. A patch should be applied to remediate this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-1180", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "Not available", "title": "binutils: GNU Binutils ld elf-eh-frame.c _bfd_elf_write_section_eh_frame memory corruption", "description": "A vulnerability classified as problematic has been found in GNU Binutils 2.43. This affects the function _bfd_elf_write_section_eh_frame of the file bfd/elf-eh-frame.c of the component ld. The manipulation leads to memory corruption. It is possible to initiate the attack remotely. The complexity of an attack is rather high. The exploitability is told to be difficult. The exploit has been disclosed to the public and may be used. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11839", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.7", "title": "binutils: GNU Binutils prdbg.c tg_tag_type return value", "description": "A security flaw has been discovered in GNU Binutils 2.45. Impacted is the function tg_tag_type of the file prdbg.c. Performing manipulation results in unchecked return value. The attack needs to be approached locally. The exploit has been released to the public and may be exploited.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11840", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.7", "title": "binutils: GNU Binutils out-of-bounds read", "description": "A weakness has been identified in GNU Binutils 2.45. The affected element is the function vfinfo of the file ldmisc.c. Executing manipulation can lead to out-of-bounds read. The attack can only be executed locally. The exploit has been made available to the public and could be exploited. This patch is called 16357. It is best practice to apply a patch to resolve this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-3198", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils objdump bucomm.c display_info memory leak", "description": "A vulnerability has been found in GNU Binutils 2.43/2.44 and classified as problematic. Affected by this vulnerability is the function display_info of the file binutils/bucomm.c of the component objdump. The manipulation leads to memory leak. An attack has to be approached locally. The exploit has been disclosed to the public and may be used. The patch is named ba6ad3a18cb26b79e0e3b84c39f707535bbc344d. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-5244", "severity": "MEDIUM", "package_name": "binutils", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils ld elflink.c elf_gc_sweep memory corruption", "description": "A vulnerability was found in GNU Binutils u o fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-7546", "severity": "MEDIUM", "package_name": "binutils-x86-64-linux-gnu", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: Binutils: Out-of-bounds Write Vulnerability", "description": "A vulnerability, which was classified as problematic, has been found in GNU Binutils 2.45. Affected by this issue is the function bfd_elf_set_group_contents of the file bfd/elf.c. The manipulation leads to out-of-bounds write. It is possible to launch the attack on the local host. The exploit has been disclosed to the public and may be used. The name of the patch is 41461010eb7c79fee7a9d5f6209accdaac66cc6b. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-8225", "severity": "MEDIUM", "package_name": "binutils-x86-64-linux-gnu", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: Binutils DWARF Section Handler Memory Leak", "description": "A vulnerability was found in GNU Binutils 2.44 and classified as problematic. This issue affects the function process_debug_info of the file binutils/dwarf.c of the component DWARF Section Handler. The manipulation leads to memory leak. Attacking locally is a requirement. The identifier of the patch is e51fdff7d2e538c0e5accdd65649ac68e6e0ddd4. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2017-13716", "severity": "LOW", "package_name": "binutils-x86-64-linux-gnu", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "Not available", "title": "binutils: Memory leak with the C++ symbol demangler routine in libiberty", "description": "The C++ symbol demangler routine in cplus-dem.c in libiberty, as distributed in GNU Binutils 2. ": "When asked to use a `.netrc` file for credentials **and** to follow HT ...", "description": "When asked to use a `.netrc` file for credentials **and** to follow HTTP\nredirects, curl could leak the password used for the first host to the\nfollowed-to host under certain circumstances.\n\nThis flaw only manifests itself if the netrc file has a `default` entry that\nomits both login and password. A rare circumstance.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-10148", "severity": "LOW", "package_name": "curl", "installed_version": "8.5.0-2ubuntu10.6", "fixed_version": "Not available", "title": "curl: predictable WebSocket mask", "description": "curl's websocket code did not update the 32 bit mask pattern for each new\n outgoing frame as the specification says. Instead it used a fixed mask that\npersisted and was used throughout the entire connection.\n\nA predictable mask pattern allows for a malicious server to induce traffic\nbetween the two communicating parties that could be interpreted by an involved\nproxy (configured or transparent) as genuine, real, HTTP traffic with content\nand thereby poison its cache. That cached poisoned content could then be\nserved to all users of that proxy.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-9086", "severity": "LOW", "package_name": "curl", "installed_version": "8.5.0-2ubuntu10.6", "fixed_version": "Not available", "title": "curl: libcurl: Curl out of bounds read for cookie path", "description": "1. A cookie is set using the `secure` keyword for `https://target`\n2. curl is redirected to or otherwise made to speak with `http://target` (same\n   hostname, but using clear text HTTP) using the same cookie set\n3. The same cookie name is set - but with just a slash as path (`path='/'`).\n   Since this site is not secure, the cookie *should* just be ignored.\n4. A bug in the path comparison logic makes curl read outside a heap buffer\n   boundary\n\nThe bug either causes a crash or it potentially makes the comparison come to\nthe wrong conclusion and lets the clear-text site override the contents of the\nsecure cookie, contrary to expectations and depending on the memory contents\nimmediately following the single-byte allocation that holds the path.\n\nThe presumed and correct behavior would be to plainly ignore the second set of\nthe cookie since it was already set as secure on a secure host so overriding\nit on an insecure host should not be okay.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2022-3219", "severity": "LOW", "package_name": "dirmngr", "installed_version": "2.4.4-2ubuntu17.3", "fixed_version": "Not available", "title": "gnupg: denial of service issue (resource consumption) using compressed packets", "description": "GnuPG can be made to spin on a relatively small input by (for example) crafting a public key with thousands of signatures attached, compressed down to just a few KB.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-6297", "severity": "LOW", "package_name": "dpkg", "installed_version": "1.22.6ubuntu6.1", "fixed_version": "1.22.6ubuntu6.5", "title": "It was discovered that dpkg-deb does not properly sanitize directory p ...", "description": "It was discovered that dpkg-deb does not properly sanitize directory permissions when extracting a control member into a temporary directory, which is\ndocumented as being a safe operation even on untrusted data. This may result in leaving temporary files behind on cleanup. Given automated and repeated execution of dpkg-deb commands on\nadversarial .deb packages or with well compressible files, placed\ninside a directory with permissions not allowing removal by a non-root\nuser, this can end up in a DoS scenario due to causing disk quota\nexhaustion or disk full conditions.", "target": "securefileshare- iner explains: \"I'm not going to commit some of the leak fixes I've been working on to the 2.44 branch due to concern that would destabilise ld. All of the reported leaks in this bugzilla have been fixed on binutils master.\"", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-0167", "severity": "LOW", "package_name": "libcurl4t64", "installed_version": "8.5.0-2ubuntu10.6", "fixed_version": "Not available", "title": "When asked to use a `.netrc` file for credentials **and** to follow HT ...", "description": "When asked to use a `.netrc` file for credentials **and** to follow HTTP\nredirects, curl could leak the password used for the first host to the\nfollowed-to host under certain circumstances.\n\nThis flaw only manifests itself if the netrc file has a `default` entry that\nomits both login and password. A rare circumstance.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-10148", "severity": "LOW", "package_name": "libcurl4t64", "installed_version": "8.5.0-2ubuntu10.6", "fixed_version": "Not available", "title": "curl: predictable WebSocket mask", "description": "curl's websocket code did not update the 32 bit mask pattern for each new\n outgoing frame as the specification says. Instead it used a fixed mask that\npersisted and was used throughout the entire connection.\n\nA predictable mask pattern allows for a malicious server to induce traffic\nbetween the two communicating parties that could be interpreted by an involved\nproxy (configured or transparent) as genuine, real, HTTP traffic with content\nand thereby poison its cache. That cached poisoned content could then be\nserved to all users of that proxy.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-9086", "severity": "LOW", "package_name": "libcurl4t64", "installed_version": "8.5.0-2ubuntu10.6", "fixed_version": "Not available", "title": "curl: libcurl: Curl out of bounds read for cookie path", "description": "1. A cookie is set using the `secure` keyword for `https://target`\n2. curl is redirected to or otherwise made to speak with `http://target` (same\n   hostname, but using clear text HTTP) using the same cookie set\n3. The same cookie name is set - but with just a slash as path (`path='/'`).\n   Since this site is not secure, the cookie *should* just be ignored.\n4. A bug in the path comparison logic makes curl read outside a heap buffer\n   boundary\n\nThe bug either causes a crash or it potentially makes the comparison come to\nthe wrong conclusion and lets the clear-text site override the contents of the\nsecure cookie, contrary to expectations and depending on the memory contents\nimmediately following the single-byte allocation that holds the path.\n\nThe presumed and correct behavior would be to plainly ignore the second set of\nthe cookie since it was already set as secure on a secure host so overriding\nit on an insecure host should not be okay.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-66382", "severity": "MEDIUM", "package_name": "libexpat1", "installed_version": "2.6.1-2ubuntu0.3", "fixed_version": "Not available", "title": "libexpat: libexpat: Denial of service via crafted file processing", "description": "In libexpat through 2.7.3, a crafted file with an approximate size of 2 MiB can lead to dozens of seconds of processing time.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-2236", "severity": "LOW", "package_name": "libgcrypt20", "installed_version": "1.10.3-2build1", "fixed_version": "Not available", "title": "libgcrypt: vulnerable to Marvin Attack", "description": "A timing-based side-channel flaw was found in libgcrypt's RSA implementation. This issue may allow a remote attacker to initiate a Bleichenbacher-style attack, which can lead to the decryption of RSA ciphertexts.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11082", "severity": "MEDIUM", "package_name": "libgprofng0", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils Linker heap-based overflow", "description": "A flaw has been found in GNU Binutils 2.45. Impacted is the function _bfd_elf_parse_eh_frame of the file bfd/elf-eh-frame.c of the component Linker. Executing manipulation can lead to heap-based buffer overflow. The attack is restricted to local execution. The exploit has been published and may be used. This patch is called ea1a0737c7692737a644af0486b71e4a392cbca8. A patch should be applied to remediate this issue. The code maintainer replied with \"[f]ixed for 2.46\".", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11083", "severity": "MEDIUM", "package_name": "libgprofng0", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils Linker heap-based overflow", "description": "A vulnerability has been found in GNU Binutils 2.45. The affected element is the function elf_swap_shdr in the library bfd/elfcode.h of the component Linker. The manipulation leads to heap-based buffer overflow. The attack must be carried out locally. The exploit has been disclosed to the public and may be used. The identifier of the patch is 9ca499644a21ceb3f946d1c179c38a83be084490. To fix this issue, it is recommended to deploy a patch. The code maintainer replied with \"[f]ixed for 2.46\".", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11412", "severity": "MEDIUM", "package_name": "libgprofng0", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.8", "title": "binutils: GNU Binutils Linker elflink.c bfd_elf_gc_record_vtentry out-of-bounds", "description": "A vulnerability has been found in race conditions to elevate their privileges to root. This CVE provides a \"complete\" fix for CVE-2025-6020.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-64505", "severity": "MEDIUM", "package_name": "libpng16-16t64", "installed_version": "1.6.43-5build1", "fixed_version": "1.6.43-5ubuntu0.1", "title": "libpng: LIBPNG heap buffer overflow via malformed palette index", "description": "LIBPNG is a reference library for use in applications that read, create, and manipulate PNG (Portable Network Graphics) raster image files. Prior to version 1.6.51, a heap buffer over-read vulnerability exists in libpng's png_do_quantize function when processing PNG files with malformed palette indices. The vulnerability occurs when palette_lookup array bounds are not validated against externally-supplied image data, allowing an attacker to craft a PNG file with out-of-range palette indices that trigger out-of-bounds memory access. This issue has been patched in version 1.6.51.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-64506", "severity": "MEDIUM", "package_name": "libpng16-16t64", "installed_version": "1.6.43-5build1", "fixed_version": "1.6.43-5ubuntu0.1", "title": "libpng: LIBPNG heap buffer over-read", "description": "LIBPNG is a reference library for use in applications that read, create, and manipulate PNG (Portable Network Graphics) raster image files. From version 1.6.0 to before 1.6.51, a heap buffer over-read vulnerability exists in libpng's png_write_image_8bit function when processing 8-bit images through the simplified write API with convert_to_8bit enabled. The vulnerability affects 8-bit grayscale+alpha, RGB/RGBA, and images with incomplete row data. A conditional guard incorrectly allows 8-bit input to enter code expecting 16-bit input, causing reads up to 2 bytes beyond allocated buffer boundaries. This issue has been patched in version 1.6.51.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-64720", "severity": "MEDIUM", "package_name": "libpng16-16t64", "installed_version": "1.6.43-5build1", "fixed_version": "1.6.43-5ubuntu0.1", "title": "libpng: LIBPNG buffer overflow", "description": "LIBPNG is a reference library for use in applications that read, create, and manipulate PNG (Portable Network Graphics) raster image files. From version 1.6.0 to before 1.6.51, an out-of-bounds read vulnerability exists in png_image_read_composite when processing palette images with PNG_FLAG_OPTIMIZE_ALPHA enabled. The palette compositing code in png_init_read_transformations incorrectly applies background compositing during premultiplication, violating the invariant component \u00e2\u2030\u00a4 alpha \u00c3\u2014 257 required by the simplified PNG API. This issue has been patched in version 1.6.51.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-65018", "severity": "MEDIUM", "package_name": "libpng16-16t64", "installed_version": "1.6.43-5build1", "fixed_version": "1.6.43-5ubuntu0.1", "title": "libpng: LIBPNG heap buffer overflow", "description": "LIBPNG is a reference library for use in applications that read, create, and manipulate PNG (Portable Network Graphics) raster image files. From version 1.6.0 to before 1.6.51, there is a heap buffer overflow vulnerability in the libpng simplified API function png_image_finish_read when processing 16-bit interlaced PNGs with 8-bit output format. Attacker-crafted interlaced PNG files cause heap writes beyond allocated buffer bounds. This issue has been patched in version 1.6.51.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-11082", "severity": "MEDIUM", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils Linker heap-based overflow", "d curefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-5245", "severity": "MEDIUM", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: GNU Binutils objdump debug.c debug_type_samep memory corruption", "description": "A vulnerability classified as critical has been found in GNU Binutils up to 2.44. This affects the function debug_type_samep of the file /binutils/debug.c of the component objdump. The manipulation leads to memory corruption. Local access is required to approach this attack. The exploit has been disclosed to the public and may be used. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-7545", "severity": "MEDIUM", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: Binutils: Heap Buffer Overflow", "description": "A vulnerability classified as problematic was found in GNU Binutils 2.45. Affected by this vulnerability is the function copy_section of the file binutils/objcopy.c. The manipulation leads to heap-based buffer overflow. Attacking locally is a requirement. The exploit has been disclosed to the public and may be used. The patch is named 08c3cbe5926e4d355b5cb70bbec2b1eeb40c2944. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-7546", "severity": "MEDIUM", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: Binutils: Out-of-bounds Write Vulnerability", "description": "A vulnerability, which was classified as problematic, has been found in GNU Binutils 2.45. Affected by this issue is the function bfd_elf_set_group_contents of the file bfd/elf.c. The manipulation leads to out-of-bounds write. It is possible to launch the attack on the local host. The exploit has been disclosed to the public and may be used. The name of the patch is 41461010eb7c79fee7a9d5f6209accdaac66cc6b. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-8225", "severity": "MEDIUM", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "2.42-4ubuntu2.6", "title": "binutils: Binutils DWARF Section Handler Memory Leak", "description": "A vulnerability was found in GNU Binutils 2.44 and classified as problematic. This issue affects the function process_debug_info of the file binutils/dwarf.c of the component DWARF Section Handler. The manipulation leads to memory leak. Attacking locally is a requirement. The identifier of the patch is e51fdff7d2e538c0e5accdd65649ac68e6e0ddd4. It is recommended to apply a patch to fix this issue.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2017-13716", "severity": "LOW", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "Not available", "title": "binutils: Memory leak with the C++ symbol demangler routine in libiberty", "description": "The C++ symbol demangler routine in cplus-dem.c in libiberty, as distributed in GNU Binutils 2.29, allows remote attackers to cause a denial of service (excessive memory allocation and application crash) via a crafted file, as demonstrated by a call from the Binary File Descriptor (BFD) library (aka libbfd).", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-1152", "severity": "LOW", "package_name": "libsframe1", "installed_version": "2.42-4ubuntu2.5", "fixed_version": "Not available", "title": "binutils: GNU Binutils ld xstrdup.c xstrdup memory leak", "description": "A vulnerability classified as problematic has been found in GNU Binutils 2.43. Affected is the function xstrdup of the file xstrdup.c of the component ld. The manipulation leads to memory leak. It is possible to launch the attack remotely. The complexity of an attack is rather high. The exploitability is told to be difficult. The exploit has been disclosed to the public and may be used. It is recommended to apply a patch to fix this issue. The code maintainer explains: \"I'm not going to commit some of the leak fixes I've been working on to the 2.44 branch due to concern that would destabilise ld. All of the reported leaks in this bugzilla have been fixed on binutils master.\"", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-8114", "severity": "LOW", "package_name": "libssh-4", "installed_version": "0.10.6-2ubuntu0.1", "fixed_version": "0.10.6-2ubuntu0.2", "title": "libssh: NULL Pointer Dereference in libssh KEX Session ID Calculation", "description": "A flaw was found in libssh, a library that implements the SSH protocol. When calculating the session ID during the key exchange (KEX) process, an allocation failure in cryptographic functions may lead to a NULL pointer dereference. This issue can cause the client or server to crash.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-9230", "severity": "MEDIUM", "package_name": "libssl3t64", "installed_version": "3.0.13-0ubuntu3.5", "fixed_version": "3.0.13-0ubuntu3.6", "title": "openssl: Out-of-bounds read & write in RFC 3211 KEK Unwrap", "description": "Issue summary: An application trying to decrypt CMS messages encrypted using\npassword based encryption can trigger an out-of-bounds read and write.\n\nImpact summary: This out-of-bounds read may trigger a crash which leads to\nDenial of Service for an application. The out-of-bounds write can cause\na memory corruption which can have various consequences including\na Denial of Service or Execution of attacker-supplied code.\n\nAlthough the consequences of a successful exploit of this vulnerability\ncould be severe, the probability that the attacker would be able to\nperform it is low. Besides, password based (PWRI) encryption support in CMS\nmessages is very rarely used. For that reason the issue was assessed as\nModerate severity according to our Security Policy.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as the CMS implementation is outside the OpenSSL FIPS module\nboundary.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-41996", "severity": "LOW", "package_name": "libssl3t64", "installed_version": "3.0.13-0ubuntu3.5", "fixed_version": "Not available", "title": "openssl: remote attackers (from the client side) to trigger unnecessarily expensive server-side DHE modular-exponentiation calculations", "description": "Validating the order of the public keys in the Diffie-Hellman Key Agreement Protocol, when an approved safe prime is used, allows remote attackers (from the client side) to trigger unnecessarily expensive server-side DHE modular-exponentiation calculations. The client may cause asymmetric resource consumption. The basic attack scenario is that the client must claim that it can only communicate with DHE, and the server must be configured to allow DHE and validate the order of the public key.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-8058", "severity": "MEDIUM", "package_name": "locales", "installed_version": "2.39-0ubuntu8.5", "fixed_version": "2.39-0ubuntu8.6", "title": "glibc: Double free in glibc", "description": "The regcomp function in the GNU C library version from 2.4 to 2.41 is \nsubject to a double free if some previous allocation fails. It can be \naccomplished either by a malloc failure or by using an interposed malloc\n that injects random malloc failures. The double free can allow buffer \nmanipulation depending of how the regex is constructed. This issue \naffects all architectures and ABIs supported by the GNU C library.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-56433", "severity": "LOW", "package_name": "login", "installed_version": "1:4.13+dfsg1-4ubuntu3.2", "fixed_version": "Not available", "title": "shadow-utils: Default subordinate ID configuration in /etc/login.defs could lead to compromise", "description": "shadow-utils (aka shadow) 4.4 through 4.17.0 establishes a default /etc/subuid behavior (e.g., uid 100000 through 165535 for the first user account) that can realistically conflict with the uids of users defined on locally administered networks, potentially leading to account takeover, e.g., by leveraging newuidmap for access to an NFS home directory (or same-host resources in the case of remote logins by these local network users). NOTE: it may also be argued that system administrators should not have assigned uids, within local networks, that are within the range that can occur in /etc/subuid.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-9230", "severity": "MEDIUM", "package_name": "openssl", "installed_version": "3.0.13-0ubuntu3.5", "fixed_version": "3.0.13-0ubuntu3.6", "title": "openssl: Out-of-bounds read & write in RFC 3211 KEK Unwrap", "description": "Issue summary: An application trying to decrypt CMS messages encrypted using\npassword based encryption can trigger an out-of-bounds read and write.\n\nImpact summary: This out-of-bounds read may trigger a crash which leads to\nDenial of Service for an application. The out-of-bounds write can cause\na memory corruption which can have various consequences including\na Denial of Service or Execution of attacker-supplied code.\n\nAlthough the consequences of a successful exploit of this vulnerability\ncould be severe, the probability that the attacker would be able to\nperform it is low. Besides, password based (PWRI) encryption support in CMS\nmessages is very rarely used. For that reason the issue was assessed as\nModerate severity according to our Security Policy.\n\nThe FIPS modules in 3.5, 3.4, 3.3, 3.2, 3.1 and 3.0 are not affected by this\nissue, as the CMS implementation is outside the OpenSSL FIPS module\nboundary.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-41996", "severity": "LOW", "package_name": "openssl", "installed_version": "3.0.13-0ubuntu3.5", "fixed_version": "Not available", "title": "openssl: remote attackers (from the client side) to trigger unnecessarily expensive server-side DHE modular-exponentiation calculations", "description": "Validating the order of the public keys in the Diffie-Hellman Key Agreement Protocol, when an approved safe prime is used, allows remote attackers (from the client side) to trigger unnecessarily expensive server-side DHE modular-exponentiation calculations. The client may cause asymmetric resource consumption. The basic attack scenario is that the client must claim that it can only communicate with DHE, and the server must be configured to allow DHE and validate the order of the public key.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-56433", "severity": "LOW", "package_name": "passwd", "installed_version": "1:4.13+dfsg1-4ubuntu3.2", "fixed_version": "Not available", "title": "shadow-utils: Default subordinate ID configuration in /etc/login.defs could lead to compromise", "description": "shadow-utils (aka shadow) 4.4 through 4.17.0 establishes a default /etc/subuid behavior (e.g., uid 100000 through 165535 for the first user account) that can realistically conflict with the uids of users defined on locally administered networks, potentially leading to account takeover, e.g., by leveraging newuidmap for access to an NFS home directory (or same-host resources in the case of remote logins by these local network users). NOTE: it may also be argued that system administrators should not have assigned uids, within local networks, that are within the range that can occur in /etc/subuid.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-45582", "severity": "MEDIUM", "package_name": "tar", "installed_version": "1.35+dfsg-3build1", "fixed_version": "Not available", "title": "tar: Tar path traversal", "description": "GNU Tar through 1.35 allows file overwrite via directory traversal in crafted TAR archives, with a certain two-step process. First, the victim must extract an archive that contains a ../ symlink to a critical directory. Second, the victim must extract an archive that contains a critical file, specified via a relative pathname that begins with the symlink name and ends with that critical file's name. Here, the extraction follows the symlink and overwrites the critical file. This bypasses the protection mechanism of \"Member name contains '..'\" that would occur for a single TAR archive that attempted to specify the critical file via a ../ approach. For example, the first archive can contain \"x -> ../../../../../home/victim/.ssh\" and the second archive can contain x/authorized_keys. This can affect server applications that automatically extract any number of user-supplied TAR archives, and were relying on the blocking of traversal. This can also affect software installation processes in which \"tar xf\" is run more than once (e.g., when installing a package can automatically install two dependencies that are set up as untrusted tarballs instead of official packages). NOTE: the official GNU Tar manual has an otherwise-empty directory for each \"tar xf\" in its Security Rules of Thumb; however, third-party advice leads users to run \"tar xf\" more than once into the same directory.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2021-31879", "severity": "MEDIUM", "package_name": "wget", "installed_version": "1.21.4-1ubuntu4.1", "fixed_version": "Not available", "title": "wget: authorization header disclosure on redirect", "description": "GNU Wget through 1.21.1 does not omit the Authorization header upon a redirect to a different origin, a related issue to CVE-2018-1000007.", "target": "securefileshare-app (ubuntu 24.04)", "image": "securefileshare-app"}, {"cve_id": "CVE-2021-22569", "severity": "HIGH", "package_name": "com.google.protobuf:protobuf-java", "installed_version": "3.11.4", "fixed_version": "3.16.1, 3.18.2, 3.19.2", "title": "protobuf-java: potential DoS in the parsing procedure for binary data", "description": "An issue in protobuf-java allowed the interleaving of com.google.protobuf.UnknownFieldSet fields in such a way that would be processed out of order. A small malicious payload can occupy the parser for several minutes by creating large numbers of short-lived objects that cause frequent, repeated pauses. We recommend upgrading libraries beyond the vulnerable versions.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2022-3509", "severity": "HIGH", "package_name": "com.google.protobuf:protobuf-java", "installed_version": "3.11.4", "fixed_version": "3.16.3, 3.19.6, 3.20.3, 3.21.7", "title": "protobuf-java: Textformat parsing issue leads to DoS", "description": "A parsing issue similar to CVE-2022-3171, but with textformat in protobuf-java core and lite versions prior to 3.21.7, 3.20.3, 3.19.6 and 3.16.3 can lead to a denial of service attack. Inputs containing multiple instances of non-repeated embedded messages with repeated or unknown fields causes objects to be converted back-n-forth between mutable and immutable forms, resulting in potentially long garbage collection pauses. We recommend updating to the versions mentioned above.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2022-3510", "severity": "HIGH", "package_name": "com.google.protobuf:protobuf-java", "installed_version": "3.11.4", "fixed_version": "3.16.3, 3.19.6, 3.20.3, 3.21.7", "title": "protobuf-java: Message-Type Extensions parsing issue leads to DoS", "description": "A parsing issue similar to CVE-2022-3171, but with Message-Type Extensions in protobuf-java core and lite versions prior to 3.21.7, 3.20.3, 3.19.6 and 3.16.3 can lead to a denial of service attack. Inputs containing multiple instances of non-repeated embedded messages with repeated or unknown fields causes objects to be converted back-n-forth between mutable and immutable forms, resulting in potentially long garbage collection pauses. We recommend updating to the versions mentioned above.\n\n", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-7254", "severity": "HIGH", "package_name": "com.google.protobuf:protobuf-java", "installed_version": "3.11.4", "fixed_version": "3.25.5, 4.27.5, 4.28.2", "title": "protobuf: StackOverflow vulnerability in Protocol Buffers", "description": "Any project that parses untrusted Protocol Buffers data\u00c2\u00a0containing an arbitrary number of nested groups / series of SGROUP\u00c2\u00a0tags can corrupted by exceeding the stack limit i.e. StackOverflow. Parsing nested groups as unknown fields with DiscardUnknownFieldsParser or Java Protobuf Lite parser, or against Protobuf map fields, creates unbounded recursions that can be abused by an attacker.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2022-3171", "severity": "MEDIUM", "package_name": "com.google.protobuf:protobuf-java", "installed_version": "3.11.4", "fixed_version": "3.21.7, 3.20.3, 3.19.6, 3.16.3", "title": "protobuf-java: timeout in parser leads to DoS", "description": "A parsing issue with binary data in protobuf-java core and lite versions prior to 3.21.7, 3.20.3, 3.19.6 and 3.16.3 can lead to a denial of service attack. Inputs containing multiple instances of non-repeated embedded messages with repeated or unknown fields causes objects to be converted back-n-forth between mutable and immutable forms, resulting in potentially long garbage collection pauses. We recommend updating to the versions mentioned above.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-48976", "severity": "HIGH", "package_name": "commons-fileupload:commons-fileupload", "installed_version": "1.5", "fixed_version": "1.6.0", "title": "apache-commons-fileupload: Apache Commons FileUpload DoS via part headers", "description": "Allocation of resources for multipart headers with insufficient limits enabled a DoS vulnerability in Apache Commons FileUpload.\n\nThis issue affects Apache Commons FileUpload: from 1.0 before 1.6; from 2.0.0-M1 before 2.0.0-M4.\n\nUsers are recommended to upgrade to versions 1.6 or 2.0.0-M4, which fix the issue.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-47554", "severity": "HIGH", "package_name": "commons-io:commons-io", "installed_version": "2.11.0", "fixed_version": "2.14.0", "title": "apache-commons-io: Possible denial of service attack on untrusted input to XmlStreamReader", "description": "Uncontrolled Resource Consumption vulnerability in Apache Commons IO.\n\nThe org.apache.commons.io.input.XmlStreamReader class may excessively consume CPU resources when processing maliciously crafted input.\n\n\nThis issue affects Apache Commons IO: from 2.0 before 2.14.0.\n\nUsers are recommended to upgrade to version 2.14.0 or later, which fixes the issue.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2023-22102", "severity": "HIGH", "package_name": "mysql:mysql-connector-java", "installed_version": "8.0.28", "fixed_version": "Not available", "title": "mysql-connector-java: Connector/J unspecified vulnerability (CPU October 2023)", "description": "Vulnerability in the MySQL Connectors product of Oracle MySQL (component: Connector/J).  Supported versions that are affected are 8.1.0 and prior. Difficult to exploit vulnerability allows unauthenticated attacker with network access via multiple protocols to compromise MySQL Connectors.  Successful attacks require human interaction from a person other than the attacker and while the vulnerability is in MySQL Connectors, attacks may significantly impact additional products (scope change). Successful attacks of this vulnerability can result in takeover of MySQL Connectors. CVSS 3.1 Base Score 8.3 (Confidentiality, Integrity and Availability impacts).  CVSS Vector: (CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H).", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2025-61795", "severity": "LOW", "package_name": "org.apache.tomcat:tomcat-catalina", "installed_version": "9.0.109", "fixed_version": "11.0.12, 10.1.47, 9.0.110", "title": "tomcat: org.apache.tomcat/tomcat-catalina: Apache Tomcat: Denial of service", "description": "Improper Resource Shutdown or Release vulnerability in Apache Tomcat.\n\nIf an error occurred (including exceeding limits) during the processing of a multipart upload, temporary copies of the uploaded parts written to disc were not cleaned up immediately but left for the garbage collection process to delete. Depending on JVM settings, application memory usage and application load, it was possible that space for the temporary copies of uploaded parts would be filled faster than GC cleared it, leading to a DoS.\n\n\n\nThis issue affects Apache Tomcat: from 11.0.0-M1 through 11.0.11, from 10.1.0-M1 through 10.1.46, from 9.0.0.M1 through 9.0.109.\n\nThe following versions were EOL at the time the CVE was created but are \nknown to be affected: 8.5.0 though 8.5.100. Other, older, EOL versions may also be affected.\nUsers are recommended to upgrade to version 11.0.12 or later, 10.1.47 or later or 9.0.110 or later which fixes the issue.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2023-5072", "severity": "HIGH", "package_name": "org.json:json", "installed_version": "20230227", "fixed_version": "20231013", "title": "JSON-java: parser confusion leads to OOM", "description": "Denial of Service  in JSON-Java versions up to and including 20230618. \u00c2\u00a0A bug in the parser means that an input string of modest size can lead to indefinite amounts of memory being used.", "target": "Java", "image": "securefileshare-app"}, {"cve_id": "CVE-2024-35255", "severity": "MEDIUM", "package_name": "github.com/Azure/azure-sdk-for-go/sdk/azidentity", "installed_version": "v1.4.0", "fixed_version": "1.6.0-beta.4.0.20240610221955-50774cd97099", "title": "azure-identity: Azure Identity Libraries Elevation of Privilege Vulnerability in github.com/Azure/azure-sdk-for-go/sdk/azidentity", "description": "Azure Identity Libraries and Microsoft Authentication Library Elevation of Privilege Vulnerability", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-41110", "severity": "CRITICAL", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "23.0.15, 26.1.5, 27.1.1, 25.0.6", "title": "moby: Authz zero length regression", "description": "Moby is an open-source project created by Docker for software containerization. A security vulnerability has been detected in certain versions of Docker Engine, which could allow an attacker to bypass authorization plugins (AuthZ) under specific circumstances. The base likelihood of this being exploited is low.\n\nUsing a specially-crafted API request, an Engine API client could make the daemon forward the request or response to an authorization plugin without the body. In certain circumstances, the authorization plugin may allow a request which it would have otherwise denied if the body had been forwarded to it.\n\nA security issue was discovered In 2018, where an attacker could bypass AuthZ plugins using a specially crafted API request. This could lead to unauthorized actions, including privilege escalation. Although this issue was fixed in Docker Engine v18.09.1 in January 2019, the fix was not carried forward to later major versions, resulting in a regression. Anyone who depends on authorization plugins that introspect the request and/or response body to make access control decisions is potentially impacted.\n\nDocker EE v19.03.x and all versions of Mirantis Container Runtime are not vulnerable.\n\ndocker-ce v27.1.1 containes patches to fix the vulnerability. Patches have also been merged into the master, 19.03, 20.0, 23.0, 24.0, 25.0, 26.0, and 26.1 release branches. If one is unable to upgrade immediately, avoid using AuthZ plugins and/or restrict access to the Docker API to trusted parties, following the principle of least privilege.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-24557", "severity": "MEDIUM", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "24.0.9, 25.0.2", "title": "moby: classic builder cache poisoning", "description": "Moby is an open-source project created by Docker to enable software containerization. The classic builder cache system is prone to cache poisoning if the image is built FROM scratch. Also, changes to some instructions (most important being HEALTHCHECK and ONBUILD) would not cause a cache miss. An attacker with the knowledge of the Dockerfile someone is using could poison their cache by making them pull a specially crafted image that would be considered as a valid cache candidate for some build steps. 23.0+ users are only affected if they explicitly opted out of Buildkit (DOCKER_BUILDKIT=0 environment variable) or are using the /build API endpoint. All users on versions older than 23.0 could be impacted. Image build API endpoint (/build) and ImageBuild function from github.com/docker/docker/client is also affected as it the uses classic builder by default. Patches are included in 24.0.9 and 25.0.2 releases.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "GHSA-jq35-85cj-fj4p", "severity": "MEDIUM", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "24.0.7, 23.0.8, 20.10.27", "title": "/sys/devices/virtual/powercap accessible by default to containers", "description": "Intel's RAPL (Running Average Power Limit) feature, introduced by the Sandy Bridge microarchitecture, provides software insights into hardware energy consumption. To facilitate this, Intel introduced the powercap framework in Linux kernel 3.13, which reads values via relevant MSRs (model specific registers) and provides unprivileged userspace access via `sysfs`. As RAPL is an interface to access a hardware feature, it is only available when running on bare metal with the module compiled into the kernel.\n\nBy 2019, it was realized that in some cases unprivileged access to RAPL readings could be exploited as a power-based side-channel against security features including AES-NI (potentially inside a SGX enclave) and KASLR (kernel address space layout randomization). Also known as the [PLATYPUS attack](https://platypusattack.com/), Intel assigned [CVE-2020-8694](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8694) and [CVE-2020-8695](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8695), and AMD assigned [CVE-2020-12912](https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-12912).\n\nSeveral mitigations were applied; Intel reduced the sampling resolution via a microcode update, and the Linux kernel [prevents access by non-root users](https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=949dd0104c496fa7c14991a23c03c62e44637e71) since 5.10. However, this kernel-based mitigation does not apply to many container-based scenarios:\n* Unless using user namespaces, root inside a container has the same level of privilege as root outside the container, but with a slightly more narrow view of the system\n* `sysfs` is mounted inside containers read-only; however only read access is needed to carry out this attack on an unpatched CPU\n\nWhile this is not a direct vulnerability in container runtimes, defense in depth and safe defaults are valuable and preferred, especially as this poses a risk to multi-tenant container environments running directly on affected hardware. This is provided by masking `/sys/devices/virtual/powercap` in the default mount configuration, and adding an additional set of rules to deny it in the default AppArmor profile.\n\nWhile `sysfs` is not the only way to read from the RAPL subsystem, other ways of accessing it require additional capabilities such as `CAP_SYS_RAWIO` which is not available to containers by default, or `perf` paranoia level less than 1, which is a non-default kernel tunable.\n\n## References\n\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8694\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-8695\n* https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-12912\n* https://platypusattack.com/\n* https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=949dd0104c496fa7c14991a23c03c62e44637e71\n* https://web.eece.maine.edu/~vweaver/projects/rapl/", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-54410", "severity": "LOW", "package_name": "github.com/docker/docker", "installed_version": "v24.0.6+incompatible", "fixed_version": "28.0.0", "title": "github.com/moby/moby: Moby's Firewalld reload removes bridge network isolation", "description": "Moby is an open source container framework developed by Docker Inc. that is distributed as Docker Engine, Mirantis Container Runtime, and various other downstream projects/products. A firewalld vulnerability affects Moby releases before 28.0.0. When firewalld reloads, Docker fails to re-create iptables rules that isolate bridge networks, allowing any container to access all ports on any other container across different bridge networks on the same host. This breaks network segmentation between containers that should be isolated, creating significant risk in multi-tenant environments. Only containers in --internal networks remain protected.\nWorkarounds include reloading firewalld and either restarting the docker daemon, re-creating bridge networks, or using rootless mode. Maintainers anticipate a fix for this issue in version 25.0.13.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-30204", "severity": "HIGH", "package_name": "github.com/golang-jwt/jwt/v5", "installed_version": "v5.0.0", "fixed_version": "5.2.2", "title": "golang-jwt/jwt: jwt-go allows excessive memory allocation during header parsing", "description": "golang-jwt is a Go implementation of JSON Web Tokens. Starting in version 3.2.0 and prior to versions 5.2.2 and 4.5.2, the function parse.ParseUnverified splits (via a call to strings.Split) its argument (which is untrusted data) on periods. As a result, in the face of a malicious request whose Authorization header consists of Bearer  followed by many period characters, a call to that function incurs allocations to the tune of O(n) bytes (where n stands for the length of the function's argument), with a constant factor of about 16. This issue is fixed in 5.2.2 and 4.5.2.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-6104", "severity": "MEDIUM", "package_name": "github.com/hashicorp/go-retryablehttp", "installed_version": "v0.7.4", "fixed_version": "0.7.7", "title": "go-retryablehttp: url might write sensitive information to log file", "description": "go-retryablehttp prior to 0.7.7 did not sanitize urls when writing them to its log file. This could lead to go-retryablehttp writing sensitive HTTP basic auth credentials to its log file. This vulnerability, CVE-2024-6104, was fixed in go-retryablehttp 0.7.7.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2024-45337", "severity": "CRITICAL", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.31.0", "title": "golang.org/x/crypto/ssh: Misuse of ServerConfig.PublicKeyCallback may cause authorization bypass in golang.org/x/crypto", "description": "Applications and libraries which misuse connection.serverAuthenticate (via callback field ServerConfig.PublicKeyCallback) may be susceptible to an authorization bypass. The documentation for ServerConfig.PublicKeyCallback says that \"A call to this function does not guarantee that the key offered is in fact used to authenticate.\" Specifically, the SSH protocol allows clients to inquire about whether a public key is acceptable before proving control of the corresponding private key. PublicKeyCallback may be called with multiple keys, and the order in which the keys were provided cannot be used to infer which key the client successfully authenticated with, if any. Some applications, which store the key(s) passed to PublicKeyCallback (or derived information) and make security relevant determinations based on it once the connection is established, may make incorrect assumptions. For example, an attacker may send public keys A and B, and then authenticate with A. PublicKeyCallback would be called only twice, first with A and then with B. A vulnerable application may then make authorization decisions based on key B for which the attacker does not actually control the private key. Since this API is widely misused, as a partial mitigation golang.org/x/cry...@v0.31.0 enforces the property that, when successfully authenticating via public key, the last key passed to ServerConfig.PublicKeyCallback will be the key used to authenticate the connection. PublicKeyCallback will now be called multiple times with the same key, if necessary. Note that the client may still not control the last key passed to PublicKeyCallback if the connection is then authenticated with a different method, such as PasswordCallback, KeyboardInteractiveCallback, or NoClientAuth. Users should be using the Extensions field of the Permissions return value from the various authentication callbacks to record data associated with the authentication attempt instead of referencing external state. Once the connection is established the state corresponding to the successful authentication attempt can be retrieved via the ServerConn.Permissions field. Note that some third-party libraries misuse the Permissions type by sharing it across authentication attempts; users of third-party libraries should refer to the relevant projects for guidance.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2025-22869", "severity": "HIGH", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.35.0", "title": "golang.org/x/crypto/ssh: Denial of Service in the Key Exchange of golang.org/x/crypto/ssh", "description": "SSH servers which implement file transfer protocols are vulnerable to a denial of service attack from clients which complete the key exchange slowly, or not at all, causing pending content to be read into memory, but never transmitted.", "target": "bin/prometheus", "image": "prom/prometheus:v2.48.0"}, {"cve_id": "CVE-2023-48795", "severity": "MEDIUM", "package_name": "golang.org/x/crypto", "installed_version": "v0.14.0", "fixed_version": "0.17.0, 0.0.0-20231218163308-9d2ee975ef9f", "title": "ssh: Prefix truncation attack on Binary Packet Protocol (BPP)", "description": "The SSH transport protocol with certain OpenSSH extensions, found in OpenSSH before 9.6 and other products, allows remote attackers to bypass integrity checks such that some packets are omitted (from the extension negotiation message), and a client and server may consequently end up with a connection for which some security features have been downgraded or disabled, aka a Terrapin attack. This occurs because the SSH Binary Packet Protocol (BPP), implemented by these extensions, mishandles the handshake phase and mishandles use of
